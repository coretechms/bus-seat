<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>오늘의 행운뽑기</title>
  <style>
    :root{
      --bg1:#fff8de; --bg2:#eef8ff; --ink:#1f2937; --muted:#667085;
      --card:#ffffff; --line:#e5e7eb; --accent:#f59e0b; --accent2:#2563eb;
      --shadow:0 18px 50px rgba(31,41,55,.15);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:linear-gradient(145deg,var(--bg1),var(--bg2))}
    body{min-height:100dvh;overflow-x:hidden}
    button{font:inherit}
    .app{min-height:100dvh;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:760px;width:100%;margin:0 auto 12px}
    .title-wrap{min-width:0}
    .title{font-size:clamp(22px,5vw,34px);font-weight:900;letter-spacing:-.04em;margin:0}
    .sub{font-size:13px;color:var(--muted);margin-top:4px}
    .exit{flex:0 0 auto;border:0;border-radius:14px;background:#111827;color:#fff;height:40px;padding:0 16px;font-weight:800;cursor:pointer}
    .member{max-width:760px;width:100%;margin:0 auto 12px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(10px);border-radius:16px;padding:10px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
    .stage{flex:1;display:flex;align-items:center;justify-content:center}
    .panel{width:min(760px,100%);background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.92);border-radius:28px;padding:clamp(16px,4vw,28px);box-shadow:var(--shadow);backdrop-filter:blur(12px)}
    .intro{text-align:center;margin-bottom:18px}
    .intro strong{display:block;font-size:clamp(18px,4vw,25px);margin-bottom:7px}
    .intro span{font-size:14px;color:var(--muted);line-height:1.6}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:0 auto}
    .card{aspect-ratio:.78;border:0;border-radius:20px;background:linear-gradient(160deg,#fff4b8,#ffd978);box-shadow:0 8px 20px rgba(180,120,0,.18);cursor:pointer;position:relative;overflow:hidden;transform:translateZ(0);transition:transform .18s ease,box-shadow .18s ease}
    .card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(180,120,0,.23)}
    .card:active{transform:scale(.97)}
    .card::before{content:"🍀";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(30px,8vw,48px);filter:drop-shadow(0 3px 3px rgba(0,0,0,.1))}
    .card::after{content:"행운";position:absolute;left:0;right:0;bottom:14px;text-align:center;font-weight:900;color:#855800;font-size:13px;letter-spacing:.12em}
    .card.chosen{animation:pick .55s ease both}
    @keyframes pick{0%{transform:scale(1)}45%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(1)}}
    .result{display:none;text-align:center;max-width:620px;margin:0 auto}
    .result.show{display:block;animation:rise .45s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .badge{display:inline-flex;align-items:center;gap:7px;background:#fff4c4;color:#8a5a00;border:1px solid #f1d87c;border-radius:999px;padding:7px 12px;font-weight:900;font-size:13px}
    .fortune-emoji{font-size:64px;line-height:1;margin:18px 0 10px}
    .fortune-title{font-size:clamp(28px,7vw,44px);font-weight:1000;letter-spacing:-.05em;margin:0 0 9px}
    .fortune-msg{font-size:clamp(16px,4vw,20px);line-height:1.7;word-break:keep-all;margin:0 auto;color:#374151}
    .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0 14px}
    .info{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 8px;min-width:0}
    .info small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
    .info strong{font-size:15px;word-break:keep-all}
    .mission{background:#eff6ff;border:1px solid #bfdbfe;border-radius:18px;padding:14px 16px;line-height:1.6;font-size:14px;color:#1e3a8a}
    .again{margin-top:13px;color:var(--muted);font-size:12px}
    .loading{padding:42px 10px;text-align:center;color:var(--muted);font-size:14px}
    .error{display:none;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:16px;padding:14px;line-height:1.55;margin-bottom:12px}
    @media(max-width:520px){
      .app{padding-left:10px;padding-right:10px}.panel{border-radius:22px;padding:16px 12px}.cards{gap:8px}.card{border-radius:16px}.info-grid{grid-template-columns:1fr}.info{display:flex;align-items:center;justify-content:space-between;padding:10px 13px}.info small{margin:0}.fortune-emoji{font-size:54px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-wrap">
        <h1 class="title">🍀 오늘의 행운뽑기</h1>
        <div class="sub" id="todayText">오늘의 행운을 확인해 보세요.</div>
      </div>
      <button class="exit" id="exitBtn" type="button">나가기</button>
    </header>

    <div class="member" id="memberBox">회원 정보를 불러오는 중입니다.</div>

    <section class="stage">
      <div class="panel">
        <div class="error" id="errorBox"></div>
        <div class="loading" id="loadingBox">회원 인증 정보를 확인하고 있습니다…</div>

        <div id="gameBox" hidden>
          <div class="intro" id="introBox">
            <strong>마음에 드는 행운카드 한 장을 골라보세요.</strong>
            <span>오늘은 한 번만 뽑을 수 있으며, 다시 들어와도 오늘의 결과는 그대로 유지됩니다.</span>
          </div>
          <div class="cards" id="cardsBox" aria-label="행운카드 선택"></div>

          <div class="result" id="resultBox">
            <div class="badge">오늘의 행운</div>
            <div class="fortune-emoji" id="fortuneEmoji">🍀</div>
            <h2 class="fortune-title" id="fortuneTitle"></h2>
            <p class="fortune-msg" id="fortuneMessage"></p>
            <div class="info-grid">
              <div class="info"><small>행운의 숫자</small><strong id="luckyNumber"></strong></div>
              <div class="info"><small>행운의 색</small><strong id="luckyColor"></strong></div>
              <div class="info"><small>좋은 방향</small><strong id="luckyDirection"></strong></div>
            </div>
            <div class="mission" id="missionText"></div>
            <div class="again">내일 다시 새로운 행운을 뽑을 수 있습니다.</div>
          </div>
        </div>
      </div>
    </section>
  </main>

<script>
(() => {
  "use strict";

  const PARENT_ORIGIN = document.referrer ? (() => { try { return new URL(document.referrer).origin; } catch (_) { return "*"; } })() : "*";
  const STORAGE_PREFIX = "geomam-lucky-v1:";
  let member = null;
  let initialized = false;

  const fortunes = [
    {emoji:"🌟",title:"대길",message:"오늘은 작은 선택이 좋은 흐름으로 이어지는 날입니다. 먼저 웃으며 인사하면 행운이 더 가까워집니다.",number:"7",color:"황금색",direction:"동쪽",mission:"오늘의 작은 미션 · 먼저 만나는 사람에게 따뜻한 인사 한마디 건네기"},
    {emoji:"🍀",title:"행운 가득",message:"기분 좋은 소식이나 반가운 만남이 생기기 좋은 날입니다. 서두르기보다 여유 있게 움직여 보세요.",number:"3",color:"초록색",direction:"남동쪽",mission:"오늘의 작은 미션 · 물 한 잔 천천히 마시며 좋은 일 한 가지 떠올리기"},
    {emoji:"⛰️",title:"기운 상승",message:"몸과 마음의 리듬이 좋아지는 날입니다. 가벼운 걷기나 스트레칭이 하루의 기분을 더 좋게 만들어 줍니다.",number:"5",color:"하늘색",direction:"북쪽",mission:"오늘의 작은 미션 · 10분만 가볍게 걷거나 스트레칭하기"},
    {emoji:"🌈",title:"반가운 변화",message:"평소와 조금 다른 선택에서 재미있는 일이 생길 수 있습니다. 새로운 것을 하나 시도해 보세요.",number:"8",color:"파란색",direction:"서쪽",mission:"오늘의 작은 미션 · 평소 안 하던 작은 일 하나 해보기"},
    {emoji:"😊",title:"사람 복",message:"사람을 통해 좋은 기운이 들어오는 날입니다. 오랜만에 생각난 사람이 있다면 안부를 전해 보세요.",number:"2",color:"주황색",direction:"남쪽",mission:"오늘의 작은 미션 · 한 사람에게 짧은 안부 메시지 보내기"},
    {emoji:"🌿",title:"편안한 하루",message:"큰 변화보다 안정적인 흐름이 좋은 날입니다. 무리하지 않고 내 속도대로 가면 만족스러운 하루가 됩니다.",number:"6",color:"연두색",direction:"북동쪽",mission:"오늘의 작은 미션 · 오늘 꼭 해야 할 일 한 가지만 먼저 끝내기"},
    {emoji:"☀️",title:"활력 충전",message:"움직일수록 기분이 살아나는 날입니다. 미뤄 둔 일을 가볍게 시작하면 생각보다 쉽게 풀릴 수 있습니다.",number:"1",color:"노란색",direction:"남서쪽",mission:"오늘의 작은 미션 · 미뤄 둔 일 하나를 5분만 시작해 보기"},
    {emoji:"🎁",title:"뜻밖의 즐거움",message:"예상하지 못한 작은 즐거움이 숨어 있는 날입니다. 결과보다 과정을 즐기면 더 좋은 기분을 얻을 수 있습니다.",number:"9",color:"보라색",direction:"서북쪽",mission:"오늘의 작은 미션 · 좋아하는 간식이나 차 한 잔 즐기기"},
    {emoji:"💛",title:"마음이 따뜻한 날",message:"베푼 마음이 좋은 기운으로 돌아오기 쉬운 날입니다. 작은 배려 하나가 오늘의 최고의 행운이 됩니다.",number:"4",color:"분홍색",direction:"남쪽",mission:"오늘의 작은 미션 · 가까운 사람에게 고맙다는 말 한마디 하기"}
  ];

  const $ = (id) => document.getElementById(id);

  function koreaDateKey(){
    const parts = new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    const map = Object.fromEntries(parts.map(p => [p.type,p.value]));
    return `${map.year}-${map.month}-${map.day}`;
  }

  function displayDate(){
    return new Intl.DateTimeFormat("ko-KR", {timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
  }

  function hashText(text){
    let h = 2166136261;
    for(let i=0;i<text.length;i++){
      h ^= text.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function resultIndex(){
    const key = `${member.code}|${koreaDateKey()}|GEOMAM-LUCKY-V1`;
    return hashText(key) % fortunes.length;
  }

  function storageKey(){ return `${STORAGE_PREFIX}${member.code}:${koreaDateKey()}`; }

  function readPlayed(){
    try { return JSON.parse(localStorage.getItem(storageKey()) || "null"); } catch (_) { return null; }
  }

  function savePlayed(cardIndex){
    try { localStorage.setItem(storageKey(), JSON.stringify({cardIndex, resultIndex:resultIndex(), at:Date.now()})); } catch (_) {}
  }

  function renderCards(){
    const wrap = $("cardsBox");
    wrap.innerHTML = "";
    for(let i=0;i<9;i++){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "card";
      btn.setAttribute("aria-label", `${i+1}번 행운카드`);
      btn.addEventListener("click", () => pickCard(i, btn), {once:true});
      wrap.appendChild(btn);
    }
  }

  function pickCard(cardIndex, button){
    document.querySelectorAll(".card").forEach(el => el.disabled = true);
    button.classList.add("chosen");
    savePlayed(cardIndex);
    setTimeout(showResult, 520);
  }

  function showResult(){
    const f = fortunes[resultIndex()];
    $("introBox").style.display = "none";
    $("cardsBox").style.display = "none";
    $("fortuneEmoji").textContent = f.emoji;
    $("fortuneTitle").textContent = f.title;
    $("fortuneMessage").textContent = f.message;
    $("luckyNumber").textContent = f.number;
    $("luckyColor").textContent = f.color;
    $("luckyDirection").textContent = f.direction;
    $("missionText").textContent = f.mission;
    $("resultBox").classList.add("show");
  }

  function initialize(session){
    if(initialized) return;
    if(!session || !session.code){
      $("loadingBox").style.display = "none";
      $("errorBox").style.display = "block";
      $("errorBox").textContent = "로그인 회원 정보를 확인할 수 없습니다. 나가기를 누른 뒤 회원 로그인 상태에서 다시 실행해 주세요.";
      return;
    }
    initialized = true;
    member = {code:String(session.code), name:String(session.name || "회원")};
    $("todayText").textContent = displayDate();
    $("memberBox").textContent = `${member.name} 회원님 · 오늘의 행운카드는 하루 한 번 열립니다.`;
    $("loadingBox").style.display = "none";
    $("gameBox").hidden = false;
    renderCards();
    if(readPlayed()) showResult();
  }

  function requestSession(){
    try { window.parent.postMessage({type:"BUS_SEAT_EVENT_READY", event:"lucky"}, PARENT_ORIGIN); } catch (_) {}
  }

  window.addEventListener("message", (event) => {
    if(PARENT_ORIGIN !== "*" && event.origin !== PARENT_ORIGIN) return;
    const data = event.data || {};
    if(data.type === "BUS_SEAT_EVENT_SESSION" && data.event === "lucky") initialize(data.session);
  });

  $("exitBtn").addEventListener("click", () => {
    try { window.parent.postMessage({type:"BUS_SEAT_EVENT_EXIT", event:"lucky"}, PARENT_ORIGIN); }
    catch (_) { history.back(); }
  });

  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape") $("exitBtn").click();
  });

  requestSession();
  setTimeout(() => { if(!initialized) requestSession(); }, 450);
  setTimeout(() => {
    if(!initialized){
      $("loadingBox").style.display = "none";
      $("errorBox").style.display = "block";
      $("errorBox").textContent = "회원 정보를 받지 못했습니다. 이 페이지는 bus-seat의 행운뽑기 버튼을 통해 실행해 주세요.";
    }
  }, 3000);
})();
</script>
</body>
</html>
