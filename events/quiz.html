function koreaDateKey(){
  try{
    var parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    var m={};parts.forEach(function(p){m[p.type]=p.value});
    return m.year+"-"+m.month+"-"+m.day;
  }catch(e){
    var d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
}

function displayDate(){
  try{
    return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
  }catch(e){return koreaDateKey()}
}

function normalizeSession(data){
  if(!data||typeof data!=="object")return null;
  var code=data.code||data.memberCode||data.loginCode||data.id||"guest";
  var name=data.name||data.memberName||data.userName||"회원";
  return {code:String(code).trim()||"guest",name:String(name).trim()||"회원"};
}

function loadSession(){
  try{
    var saved=sessionStorage.getItem(SESSION_KEY);
    if(saved)return normalizeSession(JSON.parse(saved));
  }catch(e){}
  return {code:"guest",name:"회원"};
}

function hashText(text){
  var h=2166136261;
  for(var i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}

function categoryForDate(){
  var d=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
  var day=d.getDay(); // 0 sun
  if(day===1||day===4)return "넌센스";
  if(day===2||day===5)return "상식";
  if(day===3||day===6)return "정보";
  return null;
}

function getDailyQuestion(){
  var cat=categoryForDate();
  var pool=cat?questions.filter(function(q){return q.cat===cat}):questions;
  var idx=hashText(koreaDateKey()+"|GEOMAM-QUIZ-V1")%pool.length;
  return pool[idx];
}

function playKey(){return PLAY_PREFIX+session.code+":"+koreaDateKey()}

function readPlayed(){
  try{var raw=localStorage.getItem(playKey());return raw?JSON.parse(raw):null}catch(e){return null}
}

function savePlayed(correct,userAnswer){
  try{
    localStorage.setItem(playKey(),JSON.stringify({date:koreaDateKey(),correct:correct,userAnswer:userAnswer,savedAt:Date.now()}));
  }catch(e){}
}

function renderQuestion(q){
  $("categoryText").textContent=q.cat;
  $("questionText").textContent=q.q;
  var area=$("answerArea");
  area.innerHTML="";

  if(q.type==="choice"){
    var wrap=document.createElement("div");wrap.className="answers";
    q.choices.forEach(function(choice,i){
      var b=document.createElement("button");
      b.type="button";b.className="answer-btn";b.textContent=(i+1)+". "+choice;
      b.addEventListener("click",function(){gradeChoice(q,i,b)});
      wrap.appendChild(b);
    });
    area.appendChild(wrap);
  }else if(q.type==="ox"){
    var wrap=document.createElement("div");wrap.className="answers";
    [["O",true],["X",false]].forEach(function(pair){
      var b=document.createElement("button");
      b.type="button";b.className="answer-btn";b.textContent=pair[0];
      b.addEventListener("click",function(){gradeOX(q,pair[1],b)});
      wrap.appendChild(b);
    });
    area.appendChild(wrap);
  }else{
    var row=document.createElement("div");row.className="input-row";
    var input=document.createElement("input");input.className="text-answer";input.placeholder="정답을 입력하세요";
    var btn=document.createElement("button");btn.className="submit-btn";btn.type="button";btn.textContent="정답";
    btn.addEventListener("click",function(){gradeText(q,input.value)});
    row.appendChild(input);row.appendChild(btn);area.appendChild(row);
  }
}

function lockButtons(){
  document.querySelectorAll(".answer-btn").forEach(function(b){b.disabled=true});
}

function showResult(q,correct){
  var box=$("resultBox");
  box.className="result show "+(correct?"ok":"no");
  $("resultTitle").textContent=correct?"✅ 정답입니다!":"❌ 아쉽습니다.";
  if(q.type==="choice"){
    $("correctAnswer").textContent="정답: "+q.choices[q.answer];
  }else if(q.type==="ox"){
    $("correctAnswer").textContent="정답: "+(q.answer?"O":"X");
  }else{
    $("correctAnswer").textContent="정답: "+q.answer;
  }
  $("explainText").textContent="해설: "+q.ex;
  $("statusText").textContent="오늘 문제 완료";
}

function gradeChoice(q,idx,btn){
  lockButtons();
  var correct=idx===q.answer;
  btn.classList.add(correct?"correct":"wrong");
  document.querySelectorAll(".answer-btn").forEach(function(b,i){
    if(i===q.answer)b.classList.add("correct");else if(i!==idx)b.classList.add("dim");
  });
  savePlayed(correct,idx);
  showResult(q,correct);
}

function gradeOX(q,val,btn){
  lockButtons();
  var correct=val===q.answer;
  btn.classList.add(correct?"correct":"wrong");
  document.querySelectorAll(".answer-btn").forEach(function(b){
    var isO=b.textContent==="O";
    if(isO===q.answer)b.classList.add("correct");else if(b!==btn)b.classList.add("dim");
  });
  savePlayed(correct,val);
  showResult(q,correct);
}

function gradeText(q,val){
  var ans=String(val||"").trim();
  var correct=ans===String(q.answer).trim();
  savePlayed(correct,ans);
  showResult(q,correct);
  document.querySelector(".text-answer").disabled=true;
  document.querySelector(".submit-btn").disabled=true;
}

function restorePlayed(q,played){
  if(!played)return;
  $("statusText").textContent="오늘 문제 완료";
  showResult(q,!!played.correct);
  if(q.type==="choice"){
    document.querySelectorAll(".answer-btn").forEach(function(b,i){
      b.disabled=true;
      if(i===q.answer)b.classList.add("correct");
      if(i===played.userAnswer && i!==q.answer)b.classList.add("wrong");
      if(i!==q.answer && i!==played.userAnswer)b.classList.add("dim");
    });
  }else if(q.type==="ox"){
    document.querySelectorAll(".answer-btn").forEach(function(b){
      b.disabled=true;
      var isO=b.textContent==="O";
      if(isO===q.answer)b.classList.add("correct");
      if(isO===played.userAnswer && isO!==q.answer)b.classList.add("wrong");
    });
  }
}

function sendExit(){
  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage({type:"BUS_SEAT_EVENT_EXIT",event:"quiz"},"*");
      return;
    }
  }catch(e){}
  try{history.back()}catch(e){}
}

$("backBtn").addEventListener("click",function(){
  window.location.href=new URL("index.html",window.location.href).href;
});
$("exitBtn").addEventListener("click",sendExit);

$("todayText").textContent=displayDate();
session=loadSession();
$("memberBox").textContent=session.name+" 회원님 · 오늘도 한 문제 가볍게 풀어보세요.";

var q=getDailyQuestion();
renderQuestion(q);
restorePlayed(q,readPlayed());

})();
</script>
