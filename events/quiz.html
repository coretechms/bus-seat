<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b2d58">
<title>오늘의 퀴즈</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#eef4fb;color:#111}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font-family:inherit}
.app{min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));background:radial-gradient(circle at 18% 0%,rgba(255,255,255,.96),transparent 30%),linear-gradient(180deg,#dcecff 0%,#f8fafc 48%,#eef3f8 100%)}
.shell{width:min(760px,100%);margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.title-box{min-width:0}.title{margin:0;font-size:20px;font-weight:900;color:#0b2d58;letter-spacing:-.04em}.date{margin-top:2px;font-size:11px;color:#667085}
.top-actions{display:flex;gap:6px;flex:0 0 auto}.top-btn{height:38px;min-width:66px;padding:0 12px;border:0;border-radius:14px;font-size:13px;font-weight:800;cursor:pointer}
.back-btn{background:#fff;color:#123b72;border:1px solid #b9c9dc}.exit-btn{background:#111827;color:#fff}

.progress-wrap{margin-bottom:7px;padding:7px 10px;border-radius:13px;background:#fff;border:1px solid #dce5ef;box-shadow:0 4px 12px rgba(30,60,90,.05)}
.progress-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px;font-size:12px;font-weight:800;color:#29435f}
.progress-track{height:6px;border-radius:999px;background:#e9eef4;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#2f73c8,#0b2d58);transition:width .25s ease}
.panel{padding:13px;border-radius:19px;background:rgba(255,255,255,.96);box-shadow:0 10px 26px rgba(33,56,85,.09)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px}
.category{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:#eaf3ff;color:#174d8a;font-size:11px;font-weight:900}
.status{font-size:11px;color:#667085}
.question{margin:2px 0 10px;font-size:19px;font-weight:900;line-height:1.35;color:#0f2f57;word-break:keep-all}
.answers{display:grid;gap:7px}
.answer-btn{width:100%;min-height:43px;padding:9px 12px;border:1px solid #d7e1ec;border-radius:13px;background:#fff;text-align:left;font-size:14px;font-weight:700;line-height:1.35;color:#24364b;cursor:pointer;transition:.15s}
.answer-btn:active{transform:scale(.99)}.answer-btn.correct{background:#e9f8ee;border-color:#9ed7ad;color:#166534}.answer-btn.wrong{background:#fff0ee;border-color:#f0afa8;color:#a3261d}.answer-btn.dim{opacity:.55}
.result{display:none;margin-top:9px;padding:10px 12px;border-radius:14px;line-height:1.45}.result.show{display:block}.result.ok{background:#eef9f1;border:1px solid #bfe1c7;color:#225c2b}.result.no{background:#fff4f2;border:1px solid #f3c5bf;color:#8f2d25}
.result-title{font-size:15px;font-weight:900;margin-bottom:3px}.explain{margin-top:5px;padding-top:5px;border-top:1px dashed rgba(0,0,0,.14);font-size:12px}
.next-btn{display:none;width:100%;height:40px;margin-top:8px;border:0;border-radius:13px;background:#0b2d58;color:#fff;font-size:14px;font-weight:900;cursor:pointer}.next-btn.show{display:block}

.footer-note{margin-top:8px;text-align:center;color:#7b8794;font-size:10px;line-height:1.35}
@media(max-width:520px){
  .app{padding:max(6px,env(safe-area-inset-top)) 7px max(6px,env(safe-area-inset-bottom))}
  .topbar{margin-bottom:4px}
  .title{font-size:17px}
  .date{margin-top:1px;font-size:9px}
  .top-btn{min-width:54px;height:32px;padding:0 8px;border-radius:11px;font-size:11px}
  .progress-wrap{margin-bottom:5px;padding:5px 8px;border-radius:11px}
  .progress-row{margin-bottom:3px;font-size:11px}
  .progress-track{height:5px}
  .panel{padding:9px;border-radius:16px}
  .meta{margin-bottom:5px}
  .category{height:21px;padding:0 7px;font-size:10px}
  .status{font-size:10px}
  .question{margin:1px 0 7px;font-size:16px;line-height:1.28}
  .answers{gap:5px}
  .answer-btn{min-height:38px;padding:7px 10px;border-radius:11px;font-size:12px;line-height:1.25}
  .result{margin-top:6px;padding:7px 9px;border-radius:11px;font-size:12px;line-height:1.35}
  .result-title{font-size:13px;margin-bottom:2px}
  .explain{margin-top:3px;padding-top:3px;font-size:11px;line-height:1.3}
  .next-btn{height:36px;margin-top:6px;border-radius:11px;font-size:13px}
  .footer-note{display:none}
}
</style>
</head>
<body>
<main class="app"><div class="shell">
<header class="topbar">
<div class="title-box"><h1 class="title">🧠 오늘의 퀴즈</h1><div class="date" id="todayText"></div></div>
<div class="top-actions"><button type="button" class="top-btn back-btn" id="backBtn">이벤트</button><button type="button" class="top-btn exit-btn" id="exitBtn">나가기</button></div>
</header>

<div class="progress-wrap">
  <div class="progress-row"><span id="progressText">1번째 문제</span><span id="scoreText">정답 0</span></div>
  <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
</div>

<section class="panel">
<div id="quizArea">
  <div class="meta"><span class="category" id="categoryText"></span><span class="status" id="statusText"></span></div>
  <div class="question" id="questionText"></div>
  <div id="answerArea"></div>

  <div class="result" id="resultBox">
    <div class="result-title" id="resultTitle"></div>
    <div id="correctAnswer"></div>
    <div class="explain" id="explainText"></div>
  </div>

  <button type="button" class="next-btn" id="nextBtn">다음 문제</button>
</div>

<div class="footer-note">문제 수 제한 없이 계속 도전할 수 있습니다.</div>
</section>
</div></main>

{cat:"정보",type:"ox",q:"등산 스틱은 내리막에서 무릎 부담을 줄이는 데 도움을 줄 수 있다.",answer:true,ex:"올바르게 사용하면 체중 일부를 분산해 무릎 부담을 줄이는 데 도움이 될 수 있습니다."},

];

function $(id){return document.getElementById(id)}

function koreaDateKey(){
  try{
    var parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    var m={};parts.forEach(function(p){m[p.type]=p.value});
    return m.year+"-"+m.month+"-"+m.day;
  }catch(e){
    var d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
}

function displayDate(){
  try{
    return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
  }catch(e){return koreaDateKey()}
}

function normalizeSession(data){
  if(!data||typeof data!=="object")return null;
  var code=data.code||data.memberCode||data.loginCode||data.id||"guest";
  var name=data.name||data.memberName||data.userName||"회원";
  return {code:String(code).trim()||"guest",name:String(name).trim()||"회원"};
}

function loadSession(){
  try{
    var saved=sessionStorage.getItem(SESSION_KEY);
    if(saved)return normalizeSession(JSON.parse(saved));
  }catch(e){}
  return {code:"guest",name:"회원"};
}

function hashText(text){
  var h=2166136261;
  for(var i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}

function seededOrder(list,seed){
  return list.slice().sort(function(a,b){
    return hashText(seed+"|"+a.q)-hashText(seed+"|"+b.q);
  });
}

function buildQuestionSequence(cycle){
  var date=koreaDateKey();
  var memberSeed=String(session&&session.code||"guest");
  var cycleNo=Math.max(0,Number(cycle||0));

  /* 전체 문제은행을 매 회차마다 다른 순서로 섞어서 사용 */
  return seededOrder(
    questions,
    date+"|"+memberSeed+"|CYCLE|"+cycleNo
  );
}

function stateKey(){return PLAY_PREFIX+session.code}

function loadState(){
  try{
    var raw=localStorage.getItem(stateKey());
    if(raw){
      var saved=JSON.parse(raw);
      if(saved && Array.isArray(saved.answers)){
        return {
          index:Math.max(0,Number(saved.index||0)),
          answers:saved.answers,
          score:Math.max(0,Number(saved.score||0)),
          cycle:Math.max(0,Number(saved.cycle||0)),
          totalAnswered:Math.max(0,Number(saved.totalAnswered||saved.answers.length||0))
        };
      }
    }
  }catch(e){}
  return {index:0,answers:[],score:0,cycle:0,totalAnswered:0};
}

function saveState(){
  try{localStorage.setItem(stateKey(),JSON.stringify(state))}catch(e){}
}

function currentQuestion(){return quizSequence[state.index]}

function updateProgress(){
  var questionNumber=state.totalAnswered+1;
  $("progressText").textContent=questionNumber+"번째 문제";
  $("scoreText").textContent="정답 "+state.score;

  /* 제한 없는 퀴즈이므로 진행바는 현재 문제은행 한 바퀴의 진행 정도만 표시 */
  var total=Math.max(1,quizSequence.length);
  var position=Math.min(state.index,total-1);
  $("progressBar").style.width=(((position+1)/total)*100)+"%";
}

function resetQuestionUI(){
  $("resultBox").className="result";
  $("nextBtn").className="next-btn";
  $("answerArea").innerHTML="";
  $("statusText").textContent="";
}

function renderQuestion(){
  if(!quizSequence.length){
    $("questionText").textContent="출제할 문제가 없습니다.";
    return;
  }

  if(state.index>=quizSequence.length){
    state.index=0;
  }

  $("quizArea").style.display="block";
  resetQuestionUI();

  var q=currentQuestion();
  $("categoryText").textContent=q.cat;
  $("questionText").textContent=(state.totalAnswered+1)+". "+q.q;
  updateProgress();

  var wrap=document.createElement("div");
  wrap.className="answers";

  if(q.type==="choice"){
    q.choices.forEach(function(choice,i){
      var b=document.createElement("button");
      b.type="button";b.className="answer-btn";b.textContent=(i+1)+". "+choice;
      b.addEventListener("click",function(){submitAnswer(i,b)});
      wrap.appendChild(b);
    });
  }else if(q.type==="ox"){
    [["O",true],["X",false]].forEach(function(pair){
      var b=document.createElement("button");
      b.type="button";b.className="answer-btn";b.textContent=pair[0];
      b.dataset.value=String(pair[1]);
      b.addEventListener("click",function(){submitAnswer(pair[1],b)});
      wrap.appendChild(b);
    });
  }

  $("answerArea").appendChild(wrap);

  var already=state.answers[state.index];
  if(already) restoreAnswer(already);
}

function submitAnswer(value,button){
  if(state.answers[state.index]) return;

  var q=currentQuestion();
  var correct=value===q.answer;

  state.answers[state.index]={
    value:value,
    correct:correct
  };

  if(correct) state.score++;
  state.totalAnswered++;
  saveState();

  markAnswers(q,value);
  showResult(q,correct);

  $("nextBtn").textContent="다음 문제";
  $("nextBtn").className="next-btn show";
  $("progressText").textContent=state.totalAnswered+"문제 완료";
  $("scoreText").textContent="정답 "+state.score;
}

function markAnswers(q,userValue){
  var buttons=document.querySelectorAll(".answer-btn");
  buttons.forEach(function(b){b.disabled=true});

  if(q.type==="choice"){
    buttons.forEach(function(b,i){
      if(i===q.answer)b.classList.add("correct");
      else if(i===userValue)b.classList.add("wrong");
      else b.classList.add("dim");
    });
  }else{
    buttons.forEach(function(b){
      var val=b.textContent==="O";
      if(val===q.answer)b.classList.add("correct");
      else if(val===userValue)b.classList.add("wrong");
      else b.classList.add("dim");
    });
  }
}

function showResult(q,correct){
  var box=$("resultBox");
  box.className="result show "+(correct?"ok":"no");
  $("resultTitle").textContent=correct?"✅ 정답입니다!":"❌ 아쉽습니다.";
  if(q.type==="choice"){
    $("correctAnswer").textContent="정답: "+q.choices[q.answer];
  }else{
    $("correctAnswer").textContent="정답: "+(q.answer?"O":"X");
  }
  $("explainText").textContent="해설: "+q.ex;
  $("statusText").textContent="제출 완료";
}

function restoreAnswer(saved){
  var q=currentQuestion();
  markAnswers(q,saved.value);
  showResult(q,!!saved.correct);
  $("nextBtn").textContent="다음 문제";
  $("nextBtn").className="next-btn show";
}

function nextQuestion(){
  if(!state.answers[state.index]) return;

  state.index++;

  /* 문제은행 끝까지 풀면 새 순서로 다시 시작 */
  if(state.index>=quizSequence.length){
    state.cycle++;
    state.index=0;
    state.answers=[];
    quizSequence=buildQuestionSequence(state.cycle);
  }

  saveState();
  renderQuestion();
}

function goEventMain(){
  window.location.href=new URL("index.html",window.location.href).href;
}

$("backBtn").addEventListener("click",goEventMain);
$("exitBtn").addEventListener("click",goEventMain);
$("nextBtn").addEventListener("click",nextQuestion);

$("todayText").textContent=displayDate();
session=loadSession();
quizSequence=buildQuestionSequence(0);
state=loadState();

/* 저장 데이터 이상 방지 */
if(state.index<0) state.index=0;
if(state.cycle<0) state.cycle=0;
if(state.totalAnswered<0) state.totalAnswered=0;

quizSequence=buildQuestionSequence(state.cycle);
if(state.index>=quizSequence.length){
  state.index=0;
  state.answers=[];
}

renderQuestion();

})();
</script>
