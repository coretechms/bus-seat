<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b2d58">
<title>오늘의 퀴즈</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#eef4fb;color:#111}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font-family:inherit}
.app{min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));background:radial-gradient(circle at 18% 0%,rgba(255,255,255,.96),transparent 30%),linear-gradient(180deg,#dcecff 0%,#f8fafc 48%,#eef3f8 100%)}
.shell{width:min(760px,100%);margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.title-box{min-width:0}.title{margin:0;font-size:24px;font-weight:900;color:#0b2d58;letter-spacing:-.04em;line-height:1.2}.date{margin-top:4px;font-size:13px;color:#59697b;font-weight:700}
.top-actions{display:flex;gap:8px;flex:0 0 auto}.top-btn{height:44px;min-width:74px;padding:0 15px;border:0;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer}
.back-btn{background:#fff;color:#123b72;border:1px solid #b9c9dc}.exit-btn{background:#111827;color:#fff}

.progress-wrap{margin-bottom:10px;padding:10px 13px;border-radius:15px;background:#fff;border:1px solid #d4e0ec;box-shadow:0 5px 14px rgba(30,60,90,.06)}
.progress-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:15px;font-weight:900;color:#29435f}
.progress-track{height:8px;border-radius:999px;background:#e9eef4;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#2f73c8,#0b2d58);transition:width .25s ease}
.panel{padding:18px;border-radius:22px;background:rgba(255,255,255,.98);border:1px solid #dbe5ef;box-shadow:0 10px 26px rgba(33,56,85,.09)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.category{display:inline-flex;align-items:center;min-height:30px;padding:4px 12px;border-radius:999px;background:#eaf3ff;color:#174d8a;font-size:14px;font-weight:900}
.status{font-size:13px;color:#566678;font-weight:800}
.question{margin:4px 0 14px;font-size:26px;font-weight:900;line-height:1.45;color:#0f2f57;word-break:keep-all;letter-spacing:-.02em}
.answers{display:grid;gap:10px}
.answer-btn{width:100%;min-height:60px;padding:14px 18px;border:1px solid #cfdbe8;border-radius:15px;background:#fff;text-align:left;font-size:19px;font-weight:900;line-height:1.45;color:#1f3348;cursor:pointer;transition:.15s;box-shadow:0 2px 7px rgba(20,50,80,.04)}
.answer-btn:active{transform:scale(.99)}.answer-btn.correct{background:#e9f8ee;border-color:#9ed7ad;color:#166534}.answer-btn.wrong{background:#fff0ee;border-color:#f0afa8;color:#a3261d}.answer-btn.dim{opacity:.55}
.result{display:none;margin-top:12px;padding:15px 17px;border-radius:15px;font-size:17px;line-height:1.55}.result.show{display:block}.result.ok{background:#eef9f1;border:1px solid #bfe1c7;color:#225c2b}.result.no{background:#fff4f2;border:1px solid #f3c5bf;color:#8f2d25}
.result-title{font-size:20px;font-weight:900;margin-bottom:6px}.explain{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.14);font-size:16px;line-height:1.6}
.next-btn{display:none;width:100%;height:54px;margin-top:11px;border:0;border-radius:14px;background:#0b2d58;color:#fff;font-size:18px;font-weight:900;cursor:pointer}.next-btn.show{display:block}

.footer-note{margin-top:8px;text-align:center;color:#7b8794;font-size:10px;line-height:1.35}
/* ===== 숫자 퀴즈 버튼형 계산기 + 모바일 한화면 최적화 ===== */
.quiz-tools{
  display:flex;
  gap:6px;
  margin:0 0 7px;
}
.quiz-tool-btn{
  flex:1;
  height:44px;
  border:1px solid #c8d6e5;
  border-radius:10px;
  background:#f7fbff;
  color:#24476d;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}
.quiz-tool-btn.calc-toggle{
  display:none;
  background:#eaf3ff;
  color:#174d8a;
}
.quiz-tool-btn.calc-toggle.available{display:block}
.quiz-tool-btn.active{
  background:#0b2d58;
  border-color:#0b2d58;
  color:#fff;
}
.quiz-hint{
  display:none;
  margin:0 0 10px;
  padding:11px 13px;
  border:1px solid #d7e3ee;
  border-radius:10px;
  background:#fbfdff;
  color:#506477;
  font-size:16px;
  font-weight:800;
  line-height:1.55;
}
.quiz-hint.show{display:block}

.quiz-calculator{
  display:none;
  margin:10px 0 0;
  padding:11px;
  border:1px solid #c9d9ea;
  border-radius:13px;
  background:#f8fbff;
}
.quiz-calculator.show{display:block}
.calc-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  margin-bottom:5px;
  font-size:14px;
  font-weight:900;
  color:#35526f;
}
.calc-title small{
  font-size:11px;
  font-weight:700;
  color:#7b8794;
}
.calc-display{
  width:100%;
  height:46px;
  margin-bottom:5px;
  padding:0 10px;
  border:1px solid #bdccdc;
  border-radius:9px;
  background:#fff;
  color:#172b42;
  text-align:right;
  font-size:22px;
  font-weight:900;
  outline:none;
}
.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}
.calc-key{
  min-width:0;
  height:44px;
  border:1px solid #ccd9e7;
  border-radius:8px;
  background:#fff;
  color:#23384f;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}
.calc-key.operator{
  background:#eaf3ff;
  color:#174d8a;
}
.calc-key.action{
  background:#f3f4f6;
  color:#475467;
}
.calc-key.equal{
  background:#0b2d58;
  color:#fff;
  border-color:#0b2d58;
}
.calc-key:active{transform:scale(.98)}

@media(max-width:520px){
  html,body{min-height:100%}
  body{overflow-y:auto}
  .app{
    min-height:100dvh;
    padding:max(8px,env(safe-area-inset-top)) 8px max(10px,env(safe-area-inset-bottom));
  }
  .shell{width:100%}
  .topbar{margin-bottom:7px;min-height:42px}
  .title{font-size:21px;line-height:1.2}
  .date{display:none}
  .top-actions{gap:6px}
  .top-btn{
    min-width:62px;
    height:38px;
    padding:0 10px;
    border-radius:11px;
    font-size:13px;
  }

  .progress-wrap{
    margin-bottom:7px;
    padding:8px 10px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(30,60,90,.05);
  }
  .progress-row{
    margin-bottom:4px;
    font-size:14px;
  }
  .progress-track{
    height:6px;
    margin-top:3px;
  }

  .panel{
    padding:12px 11px 13px;
    border-radius:16px;
    box-shadow:0 6px 16px rgba(33,56,85,.06);
  }
  .meta{
    margin-bottom:7px;
    min-height:26px;
  }
  .category{
    min-height:27px;
    padding:3px 9px;
    font-size:12px;
  }
  .status{font-size:12px}

  .question{
    margin:2px 0 11px;
    font-size:21px;
    line-height:1.45;
  }

  .quiz-tools{
    gap:6px;
    margin-bottom:7px;
  }
  .quiz-tool-btn{
    height:39px;
    border-radius:10px;
    font-size:13px;
  }
  .quiz-hint{
    margin-bottom:8px;
    padding:9px 11px;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
  }

  .answers{
    grid-template-columns:1fr;
    gap:7px;
  }
  .answer-btn{
    min-height:52px;
    padding:11px 13px;
    border-radius:11px;
    font-size:17px;
    line-height:1.4;
  }

  .result{
    margin-top:8px;
    padding:11px 12px;
    border-radius:11px;
    font-size:15px;
    line-height:1.5;
  }
  .result-title{
    display:block;
    margin:0 0 4px;
    font-size:18px;
  }
  #correctAnswer{
    display:block;
    font-size:15px;
    font-weight:900;
  }
  .explain{
    margin-top:6px;
    padding-top:6px;
    font-size:14px;
    line-height:1.5;
  }

  .next-btn{
    height:48px;
    margin-top:8px;
    border-radius:11px;
    font-size:17px;
  }

  .quiz-calculator{
    margin-top:8px;
    padding:8px;
    border-radius:11px;
  }
  .calc-title{
    margin-bottom:5px;
    font-size:12px;
  }
  .calc-title small{font-size:10px}
  .calc-display{
    height:40px;
    margin-bottom:5px;
    padding:0 9px;
    border-radius:8px;
    font-size:19px;
  }
  .calc-grid{gap:4px}
  .calc-key{
    height:38px;
    border-radius:7px;
    font-size:16px;
  }

  .footer-note{display:none}
}

/* 낮은 모바일 화면에서는 한 단계 더 압축 */
@media(max-width:520px) and (max-height:700px){
  .title{font-size:20px}
  .top-btn{height:36px}
  .progress-track{height:5px}
  .question{font-size:20px;line-height:1.4}
  .answer-btn{min-height:48px;padding:10px 12px;font-size:16px}
  .quiz-tool-btn{height:37px}
  .next-btn{height:45px}
  .calc-display{height:38px}
  .calc-key{height:35px;font-size:15px}
}


</style>
</head>
<body>
<main class="app"><div class="shell">
<header class="topbar">
<div class="title-box"><h1 class="title">🧠 오늘의 퀴즈</h1><div class="date" id="todayText"></div></div>
<div class="top-actions"><button type="button" class="top-btn back-btn" id="backBtn">이벤트</button><button type="button" class="top-btn exit-btn" id="exitBtn">나가기</button></div>
</header>

<div class="progress-wrap">
  <div class="progress-row"><span id="progressText">1번째 문제</span><span id="scoreText">정답 0</span></div>
  <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
</div>

<section class="panel">
<div id="quizArea">
  <div class="meta"><span class="category" id="categoryText"></span><span class="status" id="statusText"></span></div>
  <div class="question" id="questionText"></div>

  <div class="quiz-tools" id="quizTools">
    <button type="button" class="quiz-tool-btn" id="hintBtn">💡 힌트</button>
    <button type="button" class="quiz-tool-btn calc-toggle" id="calcToggleBtn">🧮 계산기</button>
  </div>

  <div class="quiz-hint" id="hintBox"></div>

  <div id="answerArea"></div>

  <div class="result" id="resultBox">
    <div class="result-title" id="resultTitle"></div>
    <div id="correctAnswer"></div>
    <div class="explain" id="explainText"></div>
  </div>

  <button type="button" class="next-btn" id="nextBtn">다음 문제</button>

  <div class="quiz-calculator" id="quizCalculator" aria-label="계산기">
  <div class="calc-title">
    <span>🧮 계산기</span>
    <small>계산기 버튼을 누르면 열립니다</small>
  </div>
  <input type="text" class="calc-display" id="calcDisplay" value="0" readonly aria-label="계산 결과">
  <div class="calc-grid" id="calcGrid">
    <button type="button" class="calc-key action" data-calc="clear">C</button>
    <button type="button" class="calc-key action" data-calc="back">⌫</button>
    <button type="button" class="calc-key operator" data-calc="op" data-value="÷">÷</button>
    <button type="button" class="calc-key operator" data-calc="op" data-value="×">×</button>

    <button type="button" class="calc-key" data-calc="num" data-value="7">7</button>
    <button type="button" class="calc-key" data-calc="num" data-value="8">8</button>
    <button type="button" class="calc-key" data-calc="num" data-value="9">9</button>
    <button type="button" class="calc-key operator" data-calc="op" data-value="-">−</button>

    <button type="button" class="calc-key" data-calc="num" data-value="4">4</button>
    <button type="button" class="calc-key" data-calc="num" data-value="5">5</button>
    <button type="button" class="calc-key" data-calc="num" data-value="6">6</button>
    <button type="button" class="calc-key operator" data-calc="op" data-value="+">＋</button>

    <button type="button" class="calc-key" data-calc="num" data-value="1">1</button>
    <button type="button" class="calc-key" data-calc="num" data-value="2">2</button>
    <button type="button" class="calc-key" data-calc="num" data-value="3">3</button>
    <button type="button" class="calc-key equal" data-calc="equal">=</button>

    <button type="button" class="calc-key" data-calc="num" data-value="0">0</button>
    <button type="button" class="calc-key" data-calc="num" data-value="00">00</button>
    <button type="button" class="calc-key" data-calc="dot">.</button>
    <button type="button" class="calc-key action" data-calc="sign">±</button>
  </div>
</div>

</div>

<div class="footer-note">2,000문제 문제은행을 계속 도전할 수 있습니다.</div>
</section>
</div></main>

<script>
(function(){
"use strict";

var SESSION_KEY="geomam-event-session";
var PLAY_PREFIX="geomam-quiz-v3-unlimited:";
var session=null;
var quizSequence=[];
var state=null;

var questions=[];
var QUIZ_DATA_URLS=["quiz-data.html?v=6","quiz-data_ver_03.html?v=6"];
var QUIZ_DATA_CACHE_KEY="geomam-quiz-data-cache-v6";

function $(id){return document.getElementById(id)}

/* ===== 숫자 퀴즈 자동 계산기 ===== */
var calcValue="0";
var calcStored=null;
var calcOperator=null;
var calcNewInput=false;

function isArithmeticQuestion(q){
  if(!q) return false;

  var questionText=String(q.q||"");
  var category=String(q.cat||"");

  /*
    계산기 표시 기준
    1. 문제 문장에 숫자(0~9)가 하나라도 있음
    2. 4지선다 선택지 중 숫자가 포함된 선택지가 2개 이상
    3. 계산/수리/단위/논리 계열 카테고리

    예:
    - 24 + 6 = ?
    - 1000m는 몇 km?
    - 1919년 / 1945년 / 1950년 선택 문제
    - 수열 2, 4, 6, 8 ...
  */

  if(/\d/.test(questionText)) return true;

  if(
    category.indexOf("계산")>=0 ||
    category.indexOf("수리")>=0 ||
    category.indexOf("수학")>=0 ||
    category.indexOf("단위")>=0 ||
    category.indexOf("논리")>=0 ||
    category.indexOf("추론")>=0
  ){
    return true;
  }

  if(q.type==="choice" && Array.isArray(q.choices)){
    var numericChoiceCount=q.choices.filter(function(choice){
      return /\d/.test(String(choice||""));
    }).length;

    if(numericChoiceCount>=2) return true;
  }

  return false;
}

function updateCalculatorVisibility(q){
  var calc=$("quizCalculator");
  var toggle=$("calcToggleBtn");
  if(!calc || !toggle) return;

  /* 새 문제에서는 계산기를 항상 닫은 상태로 시작 */
  calc.classList.remove("show");
  toggle.classList.remove("active");
  toggle.textContent="🧮 계산기";
  resetCalculator();

  if(isArithmeticQuestion(q)){
    toggle.classList.add("available");
  }else{
    toggle.classList.remove("available");
  }
}

function buildQuestionHint(q){
  if(q && q.hint) return String(q.hint);

  if(isArithmeticQuestion(q)){
    return "문제에 나온 숫자와 단위를 확인하고, 필요한 계산 순서를 차례로 생각해 보세요.";
  }

  if(q && q.type==="ox"){
    return "문장의 핵심 조건이 실제로 성립하는지 하나씩 확인해 보세요.";
  }

  return "보기들을 하나씩 비교해서 문제의 조건에 가장 잘 맞는 답을 찾아보세요.";
}

function resetHint(q){
  var box=$("hintBox");
  var btn=$("hintBtn");
  if(!box || !btn) return;

  box.classList.remove("show");
  box.textContent=buildQuestionHint(q);
  btn.classList.remove("active");
  btn.textContent="💡 힌트";
}

function toggleHint(){
  var box=$("hintBox");
  var btn=$("hintBtn");
  if(!box || !btn) return;

  var open=!box.classList.contains("show");
  box.classList.toggle("show",open);
  btn.classList.toggle("active",open);
  btn.textContent=open?"💡 힌트 닫기":"💡 힌트";
}

function toggleCalculator(){
  var calc=$("quizCalculator");
  var btn=$("calcToggleBtn");
  if(!calc || !btn || !btn.classList.contains("available")) return;

  var open=!calc.classList.contains("show");
  calc.classList.toggle("show",open);
  btn.classList.toggle("active",open);
  btn.textContent=open?"🧮 계산기 닫기":"🧮 계산기";

  if(open){
    resetCalculator();
  }
}

function renderCalc(){
  var display=$("calcDisplay");
  if(display) display.value=calcValue;
}

function resetCalculator(){
  calcValue="0";
  calcStored=null;
  calcOperator=null;
  calcNewInput=false;
  renderCalc();
}

function calcNumber(value){
  if(calcNewInput){
    calcValue=value==="00"?"0":value;
    calcNewInput=false;
  }else if(calcValue==="0"){
    calcValue=value==="00"?"0":value;
  }else if(calcValue.length<16){
    calcValue+=value;
  }
  renderCalc();
}

function calcDot(){
  if(calcNewInput){
    calcValue="0.";
    calcNewInput=false;
  }else if(calcValue.indexOf(".")<0){
    calcValue+=".";
  }
  renderCalc();
}

function calcOperation(op){
  var current=Number(calcValue);
  if(!Number.isFinite(current)) return;

  if(calcStored!==null && calcOperator && !calcNewInput){
    calculateResult();
    current=Number(calcValue);
  }

  calcStored=current;
  calcOperator=op;
  calcNewInput=true;
}

function calculateResult(){
  if(calcStored===null || !calcOperator) return;

  var b=Number(calcValue);
  var a=Number(calcStored);
  var result;

  if(calcOperator==="+") result=a+b;
  else if(calcOperator==="-") result=a-b;
  else if(calcOperator==="×") result=a*b;
  else if(calcOperator==="÷"){
    if(b===0){
      calcValue="0으로 나눌 수 없음";
      calcStored=null;
      calcOperator=null;
      calcNewInput=true;
      renderCalc();
      return;
    }
    result=a/b;
  }

  if(!Number.isFinite(result)){
    calcValue="오류";
  }else{
    result=Math.round((result+Number.EPSILON)*100000000)/100000000;
    calcValue=String(result);
  }

  calcStored=null;
  calcOperator=null;
  calcNewInput=true;
  renderCalc();
}

function calcBack(){
  if(calcNewInput) return;
  if(calcValue==="오류" || calcValue==="0으로 나눌 수 없음"){
    resetCalculator();
    return;
  }
  calcValue=calcValue.length>1?calcValue.slice(0,-1):"0";
  if(calcValue==="-" || calcValue==="") calcValue="0";
  renderCalc();
}

function calcSign(){
  if(calcValue==="오류" || calcValue==="0으로 나눌 수 없음") return;
  var n=Number(calcValue);
  if(!Number.isFinite(n)) return;
  calcValue=String(n===0?0:-n);
  renderCalc();
}

function bindCalculator(){
  var grid=$("calcGrid");
  if(!grid || grid.dataset.bound==="1") return;
  grid.dataset.bound="1";

  grid.addEventListener("click",function(event){
    var btn=event.target.closest("button[data-calc]");
    if(!btn) return;

    var action=btn.getAttribute("data-calc");
    var value=btn.getAttribute("data-value");

    if(action==="num") calcNumber(value);
    else if(action==="dot") calcDot();
    else if(action==="op") calcOperation(value);
    else if(action==="equal") calculateResult();
    else if(action==="clear") resetCalculator();
    else if(action==="back") calcBack();
    else if(action==="sign") calcSign();
  });
}

function normalizeQuizItems(items){
  return (Array.isArray(items)?items:[]).filter(function(q){
    return q&&q.q&&q.cat&&(q.type==="choice"||q.type==="ox");
  }).map(function(q){
    var out={id:Number(q.id||0),cat:String(q.cat),type:String(q.type),q:String(q.q),answer:q.type==="choice"?Number(q.answer):!!q.answer,ex:String(q.ex||"")};
    if(q.type==="choice")out.choices=Array.isArray(q.choices)?q.choices.map(String):[];
    return out;
  }).filter(function(q){return q.type==="ox"||(q.choices&&q.choices.length===4)});
}
function loadQuizDatabase(){
  return new Promise(function(resolve,reject){
    var resolved=false;
    var index=0;
    var lastError="";

    function useCache(){
      var cached=[];
      try{
        cached=normalizeQuizItems(JSON.parse(localStorage.getItem(QUIZ_DATA_CACHE_KEY)||"[]"));
      }catch(e){}
      if(cached.length>=4){
        questions=cached;
        resolved=true;
        resolve();
        return true;
      }
      return false;
    }

    function tryNext(){
      if(resolved)return;

      if(index>=QUIZ_DATA_URLS.length){
        if(useCache())return;
        reject(new Error(lastError||"퀴즈 데이터 파일을 찾지 못했습니다."));
        return;
      }

      var url=QUIZ_DATA_URLS[index++];
      var frame=document.createElement("iframe");
      var done=false;
      var timer=null;

      frame.hidden=true;
      frame.src=url;

      function cleanup(){
        window.removeEventListener("message",onMessage);
        if(timer)clearTimeout(timer);
        if(frame.parentNode)frame.remove();
      }

      function finish(items){
        if(done||resolved)return;
        var normalized=normalizeQuizItems(items);
        if(normalized.length<4){
          lastError=url+" : 유효한 문제가 없습니다.";
          cleanup();
          tryNext();
          return;
        }
        done=true;
        resolved=true;
        questions=normalized;
        try{
          localStorage.setItem(QUIZ_DATA_CACHE_KEY,JSON.stringify(normalized));
        }catch(e){}
        cleanup();
        resolve();
      }

      function onMessage(event){
        var data=event.data||{};
        if(data.type==="QUIZ_DATABASE_READY"){
          finish(data.items);
        }
      }

      window.addEventListener("message",onMessage);

      frame.onerror=function(){
        if(done||resolved)return;
        done=true;
        lastError=url+" : 파일 로드 실패";
        cleanup();
        tryNext();
      };

      timer=setTimeout(function(){
        if(done||resolved)return;
        done=true;
        lastError=url+" : 데이터 응답시간 초과";
        cleanup();
        tryNext();
      },2500);

      document.body.appendChild(frame);
    }

    tryNext();
  });
}
function koreaDateKey(){
  try{
    var parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
    var m={};parts.forEach(function(p){m[p.type]=p.value});
    return m.year+"-"+m.month+"-"+m.day;
  }catch(e){
    var d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
}

function displayDate(){
  try{
    return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
  }catch(e){return koreaDateKey()}
}

function normalizeSession(data){
  if(!data||typeof data!=="object")return null;
  var code=data.code||data.memberCode||data.loginCode||data.id||"guest";
  var name=data.name||data.memberName||data.userName||"회원";
  return {code:String(code).trim()||"guest",name:String(name).trim()||"회원"};
}

function loadSession(){
  try{
    var saved=sessionStorage.getItem(SESSION_KEY);
    if(saved)return normalizeSession(JSON.parse(saved));
  }catch(e){}
  return {code:"guest",name:"회원"};
}

function hashText(text){
  var h=2166136261;
  for(var i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}

function seededOrder(list,seed){
  return list.slice().sort(function(a,b){
    return hashText(seed+"|"+a.q)-hashText(seed+"|"+b.q);
  });
}

function buildQuestionSequence(cycle){
  var date=koreaDateKey();
  var memberSeed=String(session&&session.code||"guest");
  var cycleNo=Math.max(0,Number(cycle||0));

  /* 전체 문제은행을 매 회차마다 다른 순서로 섞어서 사용 */
  return seededOrder(
    questions,
    date+"|"+memberSeed+"|CYCLE|"+cycleNo
  );
}

function stateKey(){return PLAY_PREFIX+session.code}

function loadState(){
  try{
    var raw=localStorage.getItem(stateKey());
    if(raw){
      var saved=JSON.parse(raw);
      if(saved && Array.isArray(saved.answers)){
        return {
          index:Math.max(0,Number(saved.index||0)),
          answers:saved.answers,
          score:Math.max(0,Number(saved.score||0)),
          cycle:Math.max(0,Number(saved.cycle||0)),
          totalAnswered:Math.max(0,Number(saved.totalAnswered||saved.answers.length||0))
        };
      }
    }
  }catch(e){}
  return {index:0,answers:[],score:0,cycle:0,totalAnswered:0};
}

function saveState(){
  try{localStorage.setItem(stateKey(),JSON.stringify(state))}catch(e){}
}

function currentQuestion(){return quizSequence[state.index]}

function updateProgress(){
  var questionNumber=state.totalAnswered+1;
  $("progressText").textContent=questionNumber+"번째 문제";
  $("scoreText").textContent="정답 "+state.score;

  /* 제한 없는 퀴즈이므로 진행바는 현재 문제은행 한 바퀴의 진행 정도만 표시 */
  var total=Math.max(1,quizSequence.length);
  var position=Math.min(state.index,total-1);
  $("progressBar").style.width=(((position+1)/total)*100)+"%";
}

function resetQuestionUI(){
  $("resultBox").className="result";
  $("nextBtn").className="next-btn";
  $("answerArea").innerHTML="";
  $("statusText").textContent="";
  if($("hintBox"))$("hintBox").classList.remove("show");
  if($("hintBtn")){
    $("hintBtn").classList.remove("active");
    $("hintBtn").textContent="💡 힌트";
  }
}

function renderQuestion(){
  if(!quizSequence.length){
    $("questionText").textContent="출제할 문제가 없습니다.";
    return;
  }

  if(state.index>=quizSequence.length){
    state.index=0;
  }

  $("quizArea").style.display="block";
  resetQuestionUI();

  var q=currentQuestion();
  $("categoryText").textContent=q.cat;
  $("questionText").textContent=(state.totalAnswered+1)+". "+q.q;
  updateCalculatorVisibility(q);
  resetHint(q);
  updateProgress();

  var wrap=document.createElement("div");
  wrap.className="answers";

  if(q.type==="choice"){
    q.choices.forEach(function(choice,i){
      var b=document.createElement("button");
      b.type="button";b.className="answer-btn";b.textContent=(i+1)+". "+choice;
      b.addEventListener("click",function(){submitAnswer(i,b)});
      wrap.appendChild(b);
    });
  }else if(q.type==="ox"){
    [["O",true],["X",false]].forEach(function(pair){
      var b=document.createElement("button");
      b.type="button";b.className="answer-btn";b.textContent=pair[0];
      b.dataset.value=String(pair[1]);
      b.addEventListener("click",function(){submitAnswer(pair[1],b)});
      wrap.appendChild(b);
    });
  }

  $("answerArea").appendChild(wrap);

  var already=state.answers[state.index];
  if(already) restoreAnswer(already);
}

function submitAnswer(value,button){
  if(state.answers[state.index]) return;

  var q=currentQuestion();
  var correct=value===q.answer;

  state.answers[state.index]={
    value:value,
    correct:correct
  };

  if(correct) state.score++;
  state.totalAnswered++;
  saveState();

  markAnswers(q,value);
  showResult(q,correct);

  $("nextBtn").textContent="다음 문제";
  $("nextBtn").className="next-btn show";
  $("progressText").textContent=state.totalAnswered+"문제 완료";
  $("scoreText").textContent="정답 "+state.score;
}

function markAnswers(q,userValue){
  var buttons=document.querySelectorAll(".answer-btn");
  buttons.forEach(function(b){b.disabled=true});

  if(q.type==="choice"){
    buttons.forEach(function(b,i){
      if(i===q.answer)b.classList.add("correct");
      else if(i===userValue)b.classList.add("wrong");
      else b.classList.add("dim");
    });
  }else{
    buttons.forEach(function(b){
      var val=b.textContent==="O";
      if(val===q.answer)b.classList.add("correct");
      else if(val===userValue)b.classList.add("wrong");
      else b.classList.add("dim");
    });
  }
}

function showResult(q,correct){
  var box=$("resultBox");
  box.className="result show "+(correct?"ok":"no");
  $("resultTitle").textContent=correct?"✅ 정답입니다!":"❌ 아쉽습니다.";
  if(q.type==="choice"){
    $("correctAnswer").textContent="정답: "+q.choices[q.answer];
  }else{
    $("correctAnswer").textContent="정답: "+(q.answer?"O":"X");
  }
  $("explainText").textContent="해설: "+q.ex;
  $("statusText").textContent="제출 완료";
}

function restoreAnswer(saved){
  var q=currentQuestion();
  markAnswers(q,saved.value);
  showResult(q,!!saved.correct);
  $("nextBtn").textContent="다음 문제";
  $("nextBtn").className="next-btn show";
}

function nextQuestion(){
  if(!state.answers[state.index]) return;

  state.index++;

  /* 문제은행 끝까지 풀면 새 순서로 다시 시작 */
  if(state.index>=quizSequence.length){
    state.cycle++;
    state.index=0;
    state.answers=[];
    quizSequence=buildQuestionSequence(state.cycle);
  }

  saveState();
  renderQuestion();
}

function goEventMain(){
  window.location.href=new URL("index.html",window.location.href).href;
}

$("backBtn").addEventListener("click",goEventMain);
$("exitBtn").addEventListener("click",goEventMain);
$("nextBtn").addEventListener("click",nextQuestion);
bindCalculator();

$("hintBtn").addEventListener("click",toggleHint);
$("calcToggleBtn").addEventListener("click",toggleCalculator);

$("todayText").textContent=displayDate();
session=loadSession();

loadQuizDatabase().then(function(){
  quizSequence=buildQuestionSequence(0);
  state=loadState();

  if(state.index<0) state.index=0;
  if(state.cycle<0) state.cycle=0;
  if(state.totalAnswered<0) state.totalAnswered=0;

  quizSequence=buildQuestionSequence(state.cycle);
  if(state.index>=quizSequence.length){
    state.index=0;
    state.answers=[];
  }
  renderQuestion();
}).catch(function(error){
  $("questionText").textContent="퀴즈 문제 데이터를 불러오지 못했습니다.";
  $("statusText").textContent=String(error&&error.message||"quiz-data.html 연결 실패");
  $("answerArea").innerHTML='<div style="padding:12px;border-radius:12px;background:#fff4f2;color:#8f2d25;font-weight:800;line-height:1.5">GitHub의 events 폴더에 <b>quiz-data.html</b> 파일이 있는지 확인하세요.<br>파일명을 quiz-data_ver_03.html로 올렸다면 quiz-data.html로 변경하세요.</div>';
});

})();
</script>
