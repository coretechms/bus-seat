<script type="application/json" id="mountainDatabase">
{"schemaVersion":1,"source":"산림청 전국산정보 확장용 로컬 문제은행","generatedFor":"events/m/mountain-data.html","count":20,"items":[{"name":"설악산","region":"강원특별자치도 속초시·양양군·인제군","height":"1,708m","hint":"공룡능선, 울산바위, 천불동계곡으로 유명한 동해안 대표 명산입니다.","desc":"설악산은 최고봉 대청봉을 중심으로 웅장한 암릉과 깊은 계곡이 어우러진 산입니다. 공룡능선, 울산바위, 천불동계곡, 비선대가 특히 유명하며 가을 단풍과 겨울 설경도 뛰어납니다."},{"name":"지리산","region":"전북특별자치도 남원시·전남 구례군·경남 산청군·함양군·하동군","height":"1,915m","hint":"천왕봉, 노고단, 반야봉과 장거리 종주 코스로 유명합니다.","desc":"지리산은 대한민국 최초의 국립공원으로, 최고봉은 천왕봉입니다. 노고단·반야봉·천왕봉을 잇는 능선 종주가 유명하고, 피아골·뱀사골·칠선계곡 등 수려한 계곡도 많습니다."},{"name":"한라산","region":"제주특별자치도 제주시·서귀포시","height":"1,947m","hint":"백록담이 정상에 있으며 대한민국에서 가장 높은 산입니다.","desc":"한라산은 제주도의 중심에 솟은 화산으로 대한민국 최고봉입니다. 정상의 백록담, 영실기암, 어리목·성판악·관음사 탐방로가 유명하며 사계절 풍경이 뚜렷합니다."},{"name":"북한산","region":"서울특별시 강북구·도봉구·은평구·종로구 / 경기도 고양시","height":"836m","hint":"백운대·인수봉·만경대가 서울 도심 가까이에 솟아 있습니다.","desc":"북한산은 서울 도심에서 접근하기 좋은 대표 국립공원입니다. 최고봉 백운대를 비롯해 인수봉·만경대의 화강암 봉우리와 북한산성, 우이동 계곡 등이 유명합니다."},{"name":"태백산","region":"강원특별자치도 태백시·영월군 / 경상북도 봉화군","height":"1,567m","hint":"정상부 천제단과 겨울 눈꽃 산행으로 널리 알려져 있습니다.","desc":"태백산은 장군봉과 천제단 일대가 넓고 완만해 겨울 눈꽃 산행지로 특히 인기가 높습니다. 정상 천제단은 전통적인 제천 의식과 관련된 장소로 잘 알려져 있습니다."},{"name":"소백산","region":"충청북도 단양군 / 경상북도 영주시","height":"1,439m","hint":"비로봉과 연화봉, 봄 철쭉 군락과 겨울 능선 설경이 유명합니다.","desc":"소백산은 비로봉을 중심으로 부드러운 능선이 길게 이어지는 산입니다. 봄철 철쭉, 겨울 상고대와 설경으로 유명하며 희방사와 희방폭포도 대표 명소입니다."},{"name":"오대산","region":"강원특별자치도 평창군·홍천군·강릉시","height":"1,563m","hint":"월정사와 전나무숲길, 상원사와 비로봉으로 잘 알려져 있습니다.","desc":"오대산은 월정사 전나무숲길과 상원사, 비로봉이 대표적인 명소입니다. 비교적 완만하고 숲이 깊어 사계절 산행지로 사랑받으며, 불교 문화유산도 풍부합니다."},{"name":"치악산","region":"강원특별자치도 원주시·횡성군","height":"1,288m","hint":"원주를 대표하며 비로봉과 구룡사, 치악산의 가파른 능선이 유명합니다.","desc":"치악산은 원주의 대표 산으로 최고봉 비로봉이 중심입니다. 구룡사, 세렴폭포, 사다리병창 코스가 유명하며 비교적 경사가 급해 힘든 산행지로도 알려져 있습니다."},{"name":"월악산","region":"충청북도 제천시·충주시·단양군 / 경상북도 문경시","height":"1,097m","hint":"충주호를 바라보는 영봉의 암릉 풍경이 인상적인 산입니다.","desc":"월악산은 영봉을 중심으로 암릉과 충주호 조망이 뛰어난 산입니다. 덕주사, 송계계곡, 만수계곡 등 볼거리가 많고 정상부에서 바라보는 주변 산군의 풍경이 유명합니다."},{"name":"속리산","region":"충청북도 보은군·괴산군 / 경상북도 상주시","height":"1,058m","hint":"법주사와 문장대, 천왕봉으로 유명한 충북의 대표 산입니다.","desc":"속리산은 천왕봉과 문장대가 대표 봉우리이며 법주사가 자리하고 있습니다. 문장대에서 바라보는 암릉 조망과 세조길, 화양구곡 일대의 자연경관도 널리 알려져 있습니다."},{"name":"덕유산","region":"전북특별자치도 무주군·장수군 / 경상남도 거창군·함양군","height":"1,614m","hint":"향적봉과 겨울 상고대, 무주리조트 곤돌라로 유명합니다.","desc":"덕유산은 향적봉이 최고봉이며 겨울 상고대와 설경으로 유명합니다. 무주덕유산리조트 곤돌라를 이용해 비교적 쉽게 정상 부근까지 접근할 수 있어 겨울철 방문객이 많습니다."},{"name":"계룡산","region":"충청남도 공주시·계룡시 / 대전광역시 유성구","height":"845m","hint":"동학사·갑사와 관음봉, 삼불봉이 잘 알려진 충청권 명산입니다.","desc":"계룡산은 동학사와 갑사 같은 고찰과 함께 관음봉·삼불봉 능선이 유명합니다. 수도권과 충청권에서 접근성이 좋아 사계절 많은 탐방객이 찾습니다."},{"name":"내장산","region":"전북특별자치도 정읍시·순창군","height":"763m","hint":"가을 단풍과 내장사, 단풍터널로 전국적으로 유명합니다.","desc":"내장산은 특히 가을 단풍이 아름답기로 유명한 국립공원입니다. 내장사, 우화정, 단풍터널, 케이블카 전망대 등이 대표적인 관광 명소입니다."},{"name":"가야산","region":"경상남도 합천군 / 경상북도 성주군","height":"1,433m","hint":"해인사와 팔만대장경, 상왕봉·칠불봉이 유명합니다.","desc":"가야산은 상왕봉과 칠불봉이 대표 봉우리이며 세계적으로 잘 알려진 해인사가 자리합니다. 해인사 장경판전과 팔만대장경으로 문화적 가치도 매우 큰 산입니다."},{"name":"무등산","region":"광주광역시 / 전라남도 화순군·담양군","height":"1,187m","hint":"서석대·입석대의 거대한 주상절리와 광주 시내 조망이 유명합니다.","desc":"무등산은 광주를 대표하는 산으로 서석대와 입석대의 주상절리 경관이 유명합니다. 장불재와 중머리재 등 다양한 탐방 코스가 있으며 도심과 가까워 접근성이 좋습니다."},{"name":"주왕산","region":"경상북도 청송군","height":"721m","hint":"기암절벽과 주왕계곡, 용추폭포와 주산지로 유명합니다.","desc":"주왕산은 높이는 비교적 낮지만 거대한 기암절벽과 깊은 계곡 경관이 뛰어납니다. 주왕계곡, 용추폭포, 절골계곡과 인근 주산지의 물안개 풍경으로도 유명합니다."},{"name":"팔공산","region":"대구광역시 / 경상북도 영천시·경산시·칠곡군·군위군","height":"1,193m","hint":"동화사와 갓바위, 비로봉이 대표적인 대구·경북 명산입니다.","desc":"팔공산은 비로봉을 중심으로 긴 능선이 이어지며 동화사와 관봉 석조여래좌상, 이른바 갓바위로 유명합니다. 대구와 경북 주민들이 즐겨 찾는 대표 산행지입니다."},{"name":"관악산","region":"서울특별시 관악구·금천구 / 경기도 과천시·안양시","height":"632m","hint":"연주대와 바위 능선, 서울 남부 도심 조망으로 유명합니다.","desc":"관악산은 서울과 과천·안양 사이에 위치한 도심형 명산입니다. 연주대와 연주암, 바위 능선이 대표적이며 정상 부근에서는 서울과 과천 일대를 넓게 조망할 수 있습니다."},{"name":"도봉산","region":"서울특별시 도봉구 / 경기도 의정부시·양주시","height":"740m","hint":"자운봉·선인봉·만장봉의 웅장한 암벽과 암릉이 유명합니다.","desc":"도봉산은 북한산국립공원 북부에 위치하며 자운봉, 선인봉, 만장봉 등 화강암 봉우리가 인상적입니다. 포대능선과 도봉계곡은 산행객들에게 특히 잘 알려져 있습니다."},{"name":"마니산","region":"인천광역시 강화군 화도면","height":"472m","hint":"강화도에 있으며 정상의 참성단과 서해 조망으로 유명합니다.","desc":"마니산은 강화도 남부에 자리한 산으로 정상 부근의 참성단이 유명합니다. 단군과 관련된 전승으로 잘 알려져 있으며, 정상에서는 강화도와 서해의 넓은 풍경을 조망할 수 있습니다."}]}
</script>
