<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b2d58">
<title>오늘의 행운뽑기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#eef4fb;color:#111}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}button{font-family:inherit}
.app{min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.95),transparent 34%),linear-gradient(180deg,#dcecff 0%,#f5f8fc 45%,#eef2f7 100%)}
.shell{width:min(760px,100%);margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.title-box{min-width:0}
.title{margin:0;font-size:22px;font-weight:900;color:#0b2d58;letter-spacing:-.04em}.date{margin-top:4px;font-size:12px;color:#5d6878}.top-actions{display:flex;gap:6px;flex:0 0 auto}
.top-btn{height:38px;min-width:66px;padding:0 12px;border:0;border-radius:14px;font-size:13px;font-weight:800;cursor:pointer}.back-btn{background:#fff;color:#123b72;border:1px solid #b9c9dc}.exit-btn{background:#111827;color:#fff}
.member-box{margin-bottom:12px;padding:10px 14px;border:1px solid rgba(255,255,255,.95);border-radius:16px;background:rgba(255,255,255,.78);box-shadow:0 8px 24px rgba(30,60,90,.06);font-size:14px;line-height:1.5}
.panel{padding:18px;border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 16px 42px rgba(33,56,85,.10)}
.intro{margin-bottom:18px;text-align:center}.intro-emoji{font-size:52px;line-height:1;margin-bottom:8px}.intro h2{margin:0;font-size:23px;color:#123b72}.intro p{margin:8px 0 0;color:#667085;font-size:14px;line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lucky-card{position:relative;aspect-ratio:.78;min-height:130px;border:0;border-radius:20px;cursor:pointer;overflow:hidden;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.35),transparent 22%),linear-gradient(145deg,#1e5db4,#0b2d58 66%,#061c38);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 8px 18px rgba(11,45,88,.20)}
.lucky-card::before{content:"🍀";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(34px,9vw,58px)}.lucky-card::after{content:"행운";position:absolute;left:0;right:0;bottom:13px;text-align:center;color:#fff;font-weight:900;letter-spacing:.18em;font-size:13px}
.lucky-card.chosen{box-shadow:inset 0 0 0 3px #ffd166,0 12px 28px rgba(11,45,88,.28);transform:scale(1.04)}
.result{display:none;text-align:center}.result.show{display:block}.result-emoji{font-size:72px;line-height:1;margin:2px 0 8px}.result-title{margin:0;font-size:30px;font-weight:900;color:#0b2d58}
.result-message{margin:14px auto 20px;max-width:570px;font-size:16px;line-height:1.75;color:#344054;word-break:keep-all}.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.info{padding:12px 8px;border-radius:16px;background:#f4f7fb;border:1px solid #e1e7ef}.info small{display:block;margin-bottom:5px;color:#667085;font-size:11px}.info strong{display:block;color:#123b72;font-size:16px}
.extra-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.extra{padding:12px;border-radius:16px;background:#fff;border:1px solid #e1e7ef;text-align:left}.extra small{display:block;margin-bottom:5px;color:#667085;font-size:11px}.extra strong{color:#344054;font-size:14px;line-height:1.5}
.mission{margin-top:12px;padding:14px;border-radius:16px;background:#fff8d9;border:1px solid #f2df8f;color:#5d4b00;font-size:14px;font-weight:700;line-height:1.65}.streak{margin-top:10px;padding:12px;border-radius:16px;background:#eef8ef;border:1px solid #cfe8d1;color:#236b2b;font-size:13px;font-weight:800}
@media(max-width:520px){.title{font-size:18px}.top-btn{min-width:58px;height:36px;padding:0 10px;font-size:12px}.panel{padding:14px;border-radius:20px}.cards{gap:8px}.lucky-card{min-height:110px;border-radius:16px}.result-title{font-size:26px}.result-message{font-size:15px}}
</style>
</head>
<body>
<main class="app"><div class="shell">
<header class="topbar"><div class="title-box"><h1 class="title">🍀 오늘의 행운뽑기</h1><div class="date" id="todayText"></div></div><div class="top-actions"><button type="button" class="top-btn back-btn" id="backBtn">이벤트</button><button type="button" class="top-btn exit-btn" id="exitBtn">나가기</button></div></header>
<div class="member-box" id="memberBox">회원 정보를 확인하는 중입니다.</div>
<section class="panel">
<div class="intro" id="introBox"><div class="intro-emoji">🎁</div><h2>오늘의 행운카드를 골라보세요</h2><p>9장의 카드 중 마음에 드는 카드 하나를 눌러주세요.</p></div>
<div class="cards" id="cardsBox"></div>
<div class="result" id="resultBox">
<div class="result-emoji" id="fortuneEmoji"></div><h2 class="result-title" id="fortuneTitle"></h2><div class="result-message" id="fortuneMessage"></div>
<div class="info-grid"><div class="info"><small>행운 숫자</small><strong id="luckyNumber"></strong></div><div class="info"><small>행운 색상</small><strong id="luckyColor"></strong></div><div class="info"><small>좋은 시간</small><strong id="luckyTime"></strong></div></div>
<div class="extra-grid"><div class="extra"><small>🍲 행운 음식</small><strong id="luckyFood"></strong></div><div class="extra"><small>🥾 오늘의 산행 팁</small><strong id="hikingTip"></strong></div><div class="extra"><small>⚠️ 오늘 이것만 조심</small><strong id="cautionText"></strong></div><div class="extra"><small>💬 오늘의 한마디</small><strong id="todayWord"></strong></div></div>
<div class="mission" id="missionText"></div><div class="streak" id="streakText"></div>
</div></section></div></main>
<script>
(function(){
"use strict";
var STORAGE_PREFIX="geomam-lucky-v3:",STREAK_PREFIX="geomam-lucky-streak-v1:",session=null;
var fortunes=[
{emoji:"🌟",title:"대길",message:"오늘은 작은 선택이 좋은 흐름으로 이어지는 날입니다. 먼저 웃으며 인사하면 행운이 더 가까워집니다.",number:"7",color:"황금색",time:"오후 2~4시",food:"따뜻한 국물",hiking:"오르막에서는 보폭을 조금 줄여보세요.",caution:"너무 서두르기",word:"좋은 하루는 작은 웃음에서 시작됩니다.",mission:"오늘의 작은 미션 · 먼저 만나는 사람에게 따뜻한 인사 한마디 건네기"},
{emoji:"🍀",title:"행운 가득",message:"기분 좋은 소식이나 반가운 만남이 생기기 좋은 날입니다. 여유 있게 움직여 보세요.",number:"3",color:"초록색",time:"오전 10~11시",food:"제철 과일",hiking:"출발 전에 물과 간식을 한 번 확인해 보세요.",caution:"과식하기",word:"천천히 가도 방향이 맞으면 충분합니다.",mission:"오늘의 작은 미션 · 물 한 잔 천천히 마시기"},
{emoji:"⛰️",title:"기운 상승",message:"몸과 마음의 리듬이 좋아지는 날입니다. 가벼운 걷기나 스트레칭이 기분을 더 좋게 만들어 줍니다.",number:"5",color:"하늘색",time:"오전 8~10시",food:"달걀",hiking:"내리막에서는 무릎을 잠그지 말고 부드럽게 내려오세요.",caution:"무리한 운동",word:"조금씩 꾸준히 움직이는 힘이 큽니다.",mission:"오늘의 작은 미션 · 10분 가볍게 걷기"},
{emoji:"🌈",title:"반가운 변화",message:"평소와 조금 다른 선택에서 재미있는 일이 생길 수 있습니다.",number:"8",color:"파란색",time:"오후 3~5시",food:"국수",hiking:"휴식할 때 몸이 식지 않도록 겉옷을 챙겨보세요.",caution:"고집부리기",word:"새로운 길에는 새로운 풍경이 있습니다.",mission:"오늘의 작은 미션 · 평소 안 하던 작은 일 하나 해보기"},
{emoji:"😊",title:"사람 복",message:"사람을 통해 좋은 기운이 들어오는 날입니다. 생각난 사람이 있다면 안부를 전해 보세요.",number:"2",color:"주황색",time:"점심 전후",food:"비빔밥",hiking:"일행과 간격을 너무 벌리지 않는 것이 좋습니다.",caution:"말을 급하게 하기",word:"좋은 인연은 짧은 안부에서 이어집니다.",mission:"오늘의 작은 미션 · 한 사람에게 안부 메시지 보내기"},
{emoji:"🌿",title:"편안한 하루",message:"큰 변화보다 안정적인 흐름이 좋은 날입니다. 내 속도대로 가면 만족스러운 하루가 됩니다.",number:"6",color:"연두색",time:"오후 1~3시",food:"두부",hiking:"배낭은 등에 밀착되도록 끈을 조절해 보세요.",caution:"늦은 밤 간식",word:"편안한 마음이 가장 좋은 준비입니다.",mission:"오늘의 작은 미션 · 꼭 해야 할 일 한 가지 먼저 끝내기"},
{emoji:"☀️",title:"활력 충전",message:"움직일수록 기분이 살아나는 날입니다. 미뤄 둔 일을 가볍게 시작해 보세요.",number:"1",color:"노란색",time:"오전 9~11시",food:"고구마",hiking:"산행 전 발목과 종아리를 가볍게 풀어주세요.",caution:"준비 없이 서두르기",word:"시작한 순간 이미 절반은 해낸 것입니다.",mission:"오늘의 작은 미션 · 미뤄 둔 일 하나를 5분만 시작하기"},
{emoji:"🎁",title:"뜻밖의 즐거움",message:"예상하지 못한 작은 즐거움이 숨어 있는 날입니다. 결과보다 과정을 즐겨보세요.",number:"9",color:"보라색",time:"오후 4~6시",food:"따뜻한 차",hiking:"쉼터에서는 오래 앉기보다 가볍게 몸을 움직여 보세요.",caution:"작은 일에 짜증내기",word:"즐거움은 예상하지 않은 곳에서 찾아옵니다.",mission:"오늘의 작은 미션 · 좋아하는 차나 간식 즐기기"},
{emoji:"💛",title:"마음이 따뜻한 날",message:"베푼 마음이 좋은 기운으로 돌아오기 쉬운 날입니다. 작은 배려가 최고의 행운이 됩니다.",number:"4",color:"분홍색",time:"저녁 6~8시",food:"견과류",hiking:"서로의 속도를 맞추는 것도 좋은 산행 기술입니다.",caution:"약속시간 촉박하게 출발하기",word:"고맙다는 한마디가 하루를 밝게 만듭니다.",mission:"오늘의 작은 미션 · 가까운 사람에게 고맙다는 말 하기"}];
function $(id){return document.getElementById(id)}
function koreaDateKey(){try{var p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()),m={};p.forEach(function(x){m[x.type]=x.value});return m.year+"-"+m.month+"-"+m.day}catch(e){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}}
function displayDate(){try{return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date())}catch(e){return koreaDateKey()}}
function normalizeSession(d){if(!d||typeof d!=="object")return null;var c=d.code||d.memberCode||d.loginCode||d.id||"guest",n=d.name||d.memberName||d.userName||"회원";return{code:String(c).trim()||"guest",name:String(n).trim()||"회원"}}
function loadSession(){try{var s=sessionStorage.getItem("geomam-event-session");if(s)return normalizeSession(JSON.parse(s))}catch(e){}return{code:"guest",name:"회원"}}
function hashText(t){var h=2166136261;for(var i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function resultIndex(){return hashText(session.code+"|"+koreaDateKey()+"|GEOMAM-LUCKY-V3")%fortunes.length}
function storageKey(){return STORAGE_PREFIX+session.code+":"+koreaDateKey()}
function readPlayed(){try{var r=localStorage.getItem(storageKey());return r?JSON.parse(r):null}catch(e){return null}}
function updateStreak(){try{var k=STREAK_PREFIX+session.code,r=localStorage.getItem(k),d=r?JSON.parse(r):{dates:[]},t=koreaDateKey();if(!Array.isArray(d.dates))d.dates=[];if(d.dates.indexOf(t)<0)d.dates.push(t);if(d.dates.length>60)d.dates=d.dates.slice(-60);localStorage.setItem(k,JSON.stringify(d))}catch(e){}}
function streakCount(){try{var r=localStorage.getItem(STREAK_PREFIX+session.code),d=r?JSON.parse(r):{dates:[]};return Array.isArray(d.dates)?d.dates.length:1}catch(e){return 1}}
function savePlayed(i){try{localStorage.setItem(storageKey(),JSON.stringify({cardIndex:i,resultIndex:resultIndex(),date:koreaDateKey(),savedAt:Date.now()}))}catch(e){}updateStreak()}
function renderCards(){var w=$("cardsBox");w.innerHTML="";for(var i=0;i<9;i++)(function(idx){var b=document.createElement("button");b.type="button";b.className="lucky-card";b.setAttribute("aria-label",(idx+1)+"번 행운카드");b.addEventListener("click",function(){document.querySelectorAll(".lucky-card").forEach(function(x){x.disabled=true});b.classList.add("chosen");savePlayed(idx);setTimeout(showResult,420)},{once:true});w.appendChild(b)})(i)}
function showResult(){var f=fortunes[resultIndex()];$("introBox").style.display="none";$("cardsBox").style.display="none";$("fortuneEmoji").textContent=f.emoji;$("fortuneTitle").textContent=f.title;$("fortuneMessage").textContent=f.message;$("luckyNumber").textContent=f.number;$("luckyColor").textContent=f.color;$("luckyTime").textContent=f.time;$("luckyFood").textContent=f.food;$("hikingTip").textContent=f.hiking;$("cautionText").textContent=f.caution;$("todayWord").textContent=f.word;$("missionText").textContent=f.mission;$("streakText").textContent="🔥 행운 확인 기록 · "+streakCount()+"회";$("resultBox").classList.add("show")}
function sendExit(){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:"BUS_SEAT_EVENT_EXIT",event:"lucky"},"*");return}}catch(e){}try{history.back()}catch(e){}}
$("backBtn").addEventListener("click",function(){window.location.href=new URL("index.html",window.location.href).href});$("exitBtn").addEventListener("click",sendExit);$("todayText").textContent=displayDate();session=loadSession();$("memberBox").textContent=session.name+" 회원님 · 오늘의 행운카드는 하루 한 번 열립니다.";renderCards();if(readPlayed()){updateStreak();showResult()}
})();
</script>
</body></html>
