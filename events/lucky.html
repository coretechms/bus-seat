<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b2d58">
  <title>오늘의 행운뽑기</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #eef4fb;
      color: #111;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(12px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,.95), transparent 34%),
        linear-gradient(180deg, #dcecff 0%, #f5f8fc 45%, #eef2f7 100%);
    }

    .shell {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .title-box {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      color: #0b2d58;
      letter-spacing: -0.04em;
    }

    .date {
      margin-top: 4px;
      font-size: 12px;
      color: #5d6878;
    }

    .exit-btn {
      flex: 0 0 auto;
      height: 38px;
      min-width: 76px;
      padding: 0 16px;
      border: 0;
      border-radius: 14px;
      background: #111827;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .member-box {
      margin-bottom: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 16px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 8px 24px rgba(30,60,90,.06);
      font-size: 14px;
      line-height: 1.5;
    }

    .panel {
      padding: 18px;
      border-radius: 24px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 16px 42px rgba(33,56,85,.10);
    }

    .loading,
    .error {
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      border-radius: 18px;
      line-height: 1.7;
    }

    .loading {
      color: #445064;
      background: #f8fafc;
    }

    .error {
      display: none;
      color: #b42318;
      background: #fff2f0;
      border: 1px solid #ffd0c8;
    }

    .game {
      display: none;
    }

    .intro {
      margin-bottom: 18px;
      text-align: center;
    }

    .intro-emoji {
      font-size: 52px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .intro h2 {
      margin: 0;
      font-size: 23px;
      color: #123b72;
    }

    .intro p {
      margin: 8px 0 0;
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .lucky-card {
      position: relative;
      aspect-ratio: 0.78;
      min-height: 130px;
      border: 0;
      border-radius: 20px;
      cursor: pointer;
      overflow: hidden;
      background:
        radial-gradient(circle at 25% 15%, rgba(255,255,255,.35), transparent 22%),
        linear-gradient(145deg, #1e5db4, #0b2d58 66%, #061c38);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.18),
        0 8px 18px rgba(11,45,88,.20);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .lucky-card::before {
      content: "🍀";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(34px, 9vw, 58px);
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.25));
    }

    .lucky-card::after {
      content: "행운";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 13px;
      text-align: center;
      color: #fff;
      font-weight: 900;
      letter-spacing: .18em;
      font-size: 13px;
    }

    .lucky-card:active {
      transform: scale(.97);
    }

    .lucky-card.chosen {
      transform: scale(1.04);
      box-shadow:
        inset 0 0 0 3px #ffd166,
        0 12px 28px rgba(11,45,88,.28);
    }

    .lucky-card:disabled {
      cursor: default;
    }

    .result {
      display: none;
      text-align: center;
      animation: resultIn .36s ease both;
    }

    .result.show {
      display: block;
    }

    @keyframes resultIn {
      from { opacity: 0; transform: translateY(10px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .result-emoji {
      font-size: 72px;
      line-height: 1;
      margin: 2px 0 8px;
    }

    .result-title {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
      color: #0b2d58;
    }

    .result-message {
      margin: 14px auto 20px;
      max-width: 570px;
      font-size: 16px;
      line-height: 1.75;
      color: #344054;
      word-break: keep-all;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .info {
      padding: 12px 8px;
      border-radius: 16px;
      background: #f4f7fb;
      border: 1px solid #e1e7ef;
    }

    .info small {
      display: block;
      margin-bottom: 5px;
      color: #667085;
      font-size: 11px;
    }

    .info strong {
      display: block;
      color: #123b72;
      font-size: 17px;
    }

    .mission {
      margin-top: 12px;
      padding: 14px;
      border-radius: 16px;
      background: #fff8d9;
      border: 1px solid #f2df8f;
      color: #5d4b00;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.65;
    }

    .again {
      margin-top: 14px;
      color: #667085;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      .title { font-size: 19px; }
      .panel { padding: 14px; border-radius: 20px; }
      .cards { gap: 8px; }
      .lucky-card { min-height: 110px; border-radius: 16px; }
      .result-title { font-size: 26px; }
      .result-message { font-size: 15px; }
      .info strong { font-size: 15px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="shell">
      <header class="topbar">
        <div class="title-box">
          <h1 class="title">🍀 오늘의 행운뽑기</h1>
          <div class="date" id="todayText"></div>
        </div>
        <button type="button" class="exit-btn" id="exitBtn">나가기</button>
      </header>

      <div class="member-box" id="memberBox">
        회원 정보를 기다리는 중입니다.
      </div>

      <section class="panel">
        <div class="loading" id="loadingBox">
          bus-seat에서 로그인 회원 정보를 불러오는 중입니다.
        </div>

        <div class="error" id="errorBox"></div>

        <div class="game" id="gameBox">
          <div class="intro" id="introBox">
            <div class="intro-emoji">🎁</div>
            <h2>오늘의 행운카드를 골라보세요</h2>
            <p>
              9장의 카드 중 마음에 드는 카드 하나를 눌러주세요.<br>
              같은 회원은 오늘 하루 같은 행운 결과가 유지됩니다.
            </p>
          </div>

          <div class="cards" id="cardsBox"></div>

          <div class="result" id="resultBox">
            <div class="result-emoji" id="fortuneEmoji"></div>
            <h2 class="result-title" id="fortuneTitle"></h2>
            <div class="result-message" id="fortuneMessage"></div>

            <div class="info-grid">
              <div class="info">
                <small>행운 숫자</small>
                <strong id="luckyNumber"></strong>
              </div>
              <div class="info">
                <small>행운 색상</small>
                <strong id="luckyColor"></strong>
              </div>
              <div class="info">
                <small>좋은 방향</small>
                <strong id="luckyDirection"></strong>
              </div>
            </div>

            <div class="mission" id="missionText"></div>
            <div class="again">내일 다시 새로운 행운을 뽑을 수 있습니다.</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
  (function () {
    "use strict";

    var STORAGE_PREFIX = "geomam-lucky-v2:";
    var member = null;
    var initialized = false;
    var readyTimer = null;
    var failTimer = null;

    var fortunes = [
      {
        emoji: "🌟",
        title: "대길",
        message: "오늘은 작은 선택이 좋은 흐름으로 이어지는 날입니다. 먼저 웃으며 인사하면 행운이 더 가까워집니다.",
        number: "7",
        color: "황금색",
        direction: "동쪽",
        mission: "오늘의 작은 미션 · 먼저 만나는 사람에게 따뜻한 인사 한마디 건네기"
      },
      {
        emoji: "🍀",
        title: "행운 가득",
        message: "기분 좋은 소식이나 반가운 만남이 생기기 좋은 날입니다. 서두르기보다 여유 있게 움직여 보세요.",
        number: "3",
        color: "초록색",
        direction: "남동쪽",
        mission: "오늘의 작은 미션 · 물 한 잔 천천히 마시며 좋은 일 한 가지 떠올리기"
      },
      {
        emoji: "⛰️",
        title: "기운 상승",
        message: "몸과 마음의 리듬이 좋아지는 날입니다. 가벼운 걷기나 스트레칭이 하루의 기분을 더 좋게 만들어 줍니다.",
        number: "5",
        color: "하늘색",
        direction: "북쪽",
        mission: "오늘의 작은 미션 · 10분만 가볍게 걷거나 스트레칭하기"
      },
      {
        emoji: "🌈",
        title: "반가운 변화",
        message: "평소와 조금 다른 선택에서 재미있는 일이 생길 수 있습니다. 새로운 것을 하나 시도해 보세요.",
        number: "8",
        color: "파란색",
        direction: "서쪽",
        mission: "오늘의 작은 미션 · 평소 안 하던 작은 일 하나 해보기"
      },
      {
        emoji: "😊",
        title: "사람 복",
        message: "사람을 통해 좋은 기운이 들어오는 날입니다. 오랜만에 생각난 사람이 있다면 안부를 전해 보세요.",
        number: "2",
        color: "주황색",
        direction: "남쪽",
        mission: "오늘의 작은 미션 · 한 사람에게 짧은 안부 메시지 보내기"
      },
      {
        emoji: "🌿",
        title: "편안한 하루",
        message: "큰 변화보다 안정적인 흐름이 좋은 날입니다. 무리하지 않고 내 속도대로 가면 만족스러운 하루가 됩니다.",
        number: "6",
        color: "연두색",
        direction: "북동쪽",
        mission: "오늘의 작은 미션 · 오늘 꼭 해야 할 일 한 가지만 먼저 끝내기"
      },
      {
        emoji: "☀️",
        title: "활력 충전",
        message: "움직일수록 기분이 살아나는 날입니다. 미뤄 둔 일을 가볍게 시작하면 생각보다 쉽게 풀릴 수 있습니다.",
        number: "1",
        color: "노란색",
        direction: "남서쪽",
        mission: "오늘의 작은 미션 · 미뤄 둔 일 하나를 5분만 시작해 보기"
      },
      {
        emoji: "🎁",
        title: "뜻밖의 즐거움",
        message: "예상하지 못한 작은 즐거움이 숨어 있는 날입니다. 결과보다 과정을 즐기면 더 좋은 기분을 얻을 수 있습니다.",
        number: "9",
        color: "보라색",
        direction: "서북쪽",
        mission: "오늘의 작은 미션 · 좋아하는 간식이나 차 한 잔 즐기기"
      },
      {
        emoji: "💛",
        title: "마음이 따뜻한 날",
        message: "베푼 마음이 좋은 기운으로 돌아오기 쉬운 날입니다. 작은 배려 하나가 오늘의 최고의 행운이 됩니다.",
        number: "4",
        color: "분홍색",
        direction: "남쪽",
        mission: "오늘의 작은 미션 · 가까운 사람에게 고맙다는 말 한마디 하기"
      }
    ];

    function $(id) {
      return document.getElementById(id);
    }

    function koreaDateKey() {
      try {
        var parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());

        var map = {};

        parts.forEach(function (part) {
          map[part.type] = part.value;
        });

        return map.year + "-" + map.month + "-" + map.day;
      } catch (error) {
        var now = new Date();

        return now.getFullYear() + "-" +
          String(now.getMonth() + 1).padStart(2, "0") + "-" +
          String(now.getDate()).padStart(2, "0");
      }
    }

    function displayDate() {
      try {
        return new Intl.DateTimeFormat("ko-KR", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "long"
        }).format(new Date());
      } catch (error) {
        return koreaDateKey();
      }
    }

    function hashText(text) {
      var h = 2166136261;

      for (var i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }

      return h >>> 0;
    }

    function resultIndex() {
      var key =
        String(member.code) +
        "|" +
        koreaDateKey() +
        "|GEOMAM-LUCKY-V2";

      return hashText(key) % fortunes.length;
    }

    function storageKey() {
      return STORAGE_PREFIX + member.code + ":" + koreaDateKey();
    }

    function readPlayed() {
      try {
        var raw = localStorage.getItem(storageKey());

        if (!raw) return null;

        return JSON.parse(raw);
      } catch (error) {
        return null;
      }
    }

    function savePlayed(cardIndex) {
      try {
        localStorage.setItem(
          storageKey(),
          JSON.stringify({
            cardIndex: cardIndex,
            resultIndex: resultIndex(),
            date: koreaDateKey(),
            savedAt: Date.now()
          })
        );
      } catch (error) {}
    }

    function showError(message) {
      $("loadingBox").style.display = "none";
      $("gameBox").style.display = "none";
      $("errorBox").textContent = message;
      $("errorBox").style.display = "flex";
    }

    function renderCards() {
      var wrap = $("cardsBox");

      wrap.innerHTML = "";

      for (var i = 0; i < 9; i++) {
        (function (cardIndex) {
          var button = document.createElement("button");

          button.type = "button";
          button.className = "lucky-card";

          button.setAttribute(
            "aria-label",
            String(cardIndex + 1) + "번 행운카드"
          );

          button.addEventListener("click", function () {
            pickCard(cardIndex, button);
          }, { once: true });

          wrap.appendChild(button);
        })(i);
      }
    }

    function pickCard(cardIndex, selectedButton) {
      var buttons = document.querySelectorAll(".lucky-card");

      buttons.forEach(function (button) {
        button.disabled = true;
      });

      selectedButton.classList.add("chosen");

      savePlayed(cardIndex);

      window.setTimeout(function () {
        showResult();
      }, 450);
    }

    function showResult() {
      if (!member) return;

      var fortune = fortunes[resultIndex()];

      $("introBox").style.display = "none";
      $("cardsBox").style.display = "none";

      $("fortuneEmoji").textContent = fortune.emoji;
      $("fortuneTitle").textContent = fortune.title;
      $("fortuneMessage").textContent = fortune.message;
      $("luckyNumber").textContent = fortune.number;
      $("luckyColor").textContent = fortune.color;
      $("luckyDirection").textContent = fortune.direction;
      $("missionText").textContent = fortune.mission;

      $("resultBox").classList.add("show");
    }

    function normalizeSession(session) {
      if (!session || typeof session !== "object") return null;

      var code =
        session.code ||
        session.memberCode ||
        session.loginCode ||
        session.id ||
        "";

      var name =
        session.name ||
        session.memberName ||
        session.userName ||
        "회원";

      code = String(code || "").trim();
      name = String(name || "회원").trim();

      if (!code) return null;

      return {
        code: code,
        name: name || "회원"
      };
    }

    function initialize(session) {
      if (initialized) return;

      var normalized = normalizeSession(session);

      if (!normalized) {
        showError(
          "로그인 회원 정보를 확인할 수 없습니다.\n" +
          "나가기를 누른 뒤 bus-seat에서 다시 실행해 주세요."
        );

        return;
      }

      initialized = true;
      member = normalized;

      if (readyTimer) {
        clearInterval(readyTimer);
        readyTimer = null;
      }

      if (failTimer) {
        clearTimeout(failTimer);
        failTimer = null;
      }

      $("memberBox").textContent =
        member.name +
        " 회원님 · 오늘의 행운카드는 하루 한 번 열립니다.";

      $("loadingBox").style.display = "none";
      $("errorBox").style.display = "none";
      $("gameBox").style.display = "block";

      renderCards();

      if (readPlayed()) {
        showResult();
      }
    }

    function sendReady() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: "BUS_SEAT_EVENT_READY",
            event: "lucky"
          }, "*");
        }
      } catch (error) {}
    }

    function sendExit() {
      var sent = false;

      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: "BUS_SEAT_EVENT_EXIT",
            event: "lucky"
          }, "*");

          sent = true;
        }
      } catch (error) {}

      if (!sent) {
        try {
          window.close();
        } catch (error) {}

        try {
          history.back();
        } catch (error) {}
      }
    }

    window.addEventListener("message", function (event) {
      var data = event.data || {};

      if (
        data.type === "BUS_SEAT_EVENT_SESSION" &&
        data.event === "lucky"
      ) {
        initialize(data.session);
      }
    });

    $("exitBtn").addEventListener("click", function () {
      sendExit();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        sendExit();
      }
    });

    $("todayText").textContent = displayDate();

    sendReady();

    readyTimer = window.setInterval(function () {
      if (!initialized) {
        sendReady();
      }
    }, 700);

    failTimer = window.setTimeout(function () {
      if (!initialized) {
        showError(
          "bus-seat에서 회원 정보를 받지 못했습니다.\n" +
          "이 페이지는 bus-seat의 행운뽑기 버튼을 통해 실행해야 합니다."
        );
      }
    }, 8000);

  })();
  </script>
</body>
</html>
