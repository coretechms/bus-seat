.fortune-summary{font-size:15px;font-weight:900;line-height:1.45;word-break:keep-all}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}

function $(id){return document.getElementById(id)}

function getKoreaNowParts(){
  try{
    var parts=new Intl.DateTimeFormat("en-CA",{
      timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"
    }).formatToParts(new Date());
    var m={};
    parts.forEach(function(p){m[p.type]=p.value});
    return {year:Number(m.year),month:Number(m.month),day:Number(m.day)};
  }catch(e){
    var d=new Date();
    return {year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate()};
  }
}

function koreaDateKey(){
  var p=getKoreaNowParts();
  return p.year+"-"+String(p.month).padStart(2,"0")+"-"+String(p.day).padStart(2,"0");
}

function displayDate(){
  try{
    return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
  }catch(e){return koreaDateKey()}
}

function normalizeSession(data){
  if(!data||typeof data!=="object")return null;
  return {
    code:String(data.code||data.memberCode||data.loginCode||data.id||"guest").trim()||"guest",
    name:String(data.name||data.memberName||data.userName||"회원").trim()||"회원",
    birthDate:String(data.birthDate||data.rrn||data.birth||data.birthYear||"").replace(/\D/g,"").slice(0,6)
  };
}

function loadSession(){
  try{
    var raw=sessionStorage.getItem(SESSION_KEY);
    if(raw)return normalizeSession(JSON.parse(raw));
  }catch(e){}
  return {code:"guest",name:"회원",birthDate:""};
}

function parseBirth6(value){
  var digits=String(value||"").replace(/\D/g,"");
  if(digits.length!==6)return null;

  var yy=Number(digits.slice(0,2));
  var month=Number(digits.slice(2,4));
  var day=Number(digits.slice(4,6));
  var now=getKoreaNowParts();
  var currentYY=now.year%100;

  /* 현재 연도보다 큰 두 자리 연도는 1900년대, 그 이하는 2000년대로 해석 */
  var year=yy<=currentYY?2000+yy:1900+yy;

  if(month<1||month>12||day<1||day>31)return null;
  var test=new Date(year,month-1,day);
  if(test.getFullYear()!==year||test.getMonth()!==month-1||test.getDate()!==day)return null;

  return {year:year,month:month,day:day,raw:digits};
}

function zodiacForYear(year){
  var idx=((year-2020)%12+12)%12;
  return zodiacOrder[idx];
}

function ageAtToday(year,month,day){
  var now=getKoreaNowParts();
  var age=now.year-year;
  if(now.month<month || (now.month===month && now.day<day))age--;
  return age;
}

function nearestYearForZodiac(baseYear,zodiac){
  var best=null;
  for(var delta=-24;delta<=24;delta++){
    var y=baseYear+delta;
    if(zodiacForYear(y)!==zodiac)continue;
    var candidate={year:y,delta:delta,distance:Math.abs(delta)};
    if(!best ||
       candidate.distance<best.distance ||
       (candidate.distance===best.distance && candidate.year<best.year)){
      best=candidate;
    }
  }
  return best?best.year:baseYear;
}

function profileText(year,month,day,zodiac){
  var age=ageAtToday(year,month,day);
  return year+"년생 · 만 "+age+"세 · "+zodiac+"띠";
}

function hashText(text){
  var h=2166136261;
  for(var i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}

function pick(arr,seed,salt){
  return arr[hashText(seed+"|"+salt)%arr.length];
}

function loadSelectedZodiac(defaultValue){
  try{
    return localStorage.getItem(ZODIAC_KEY+session.code)||defaultValue;
  }catch(e){return defaultValue}
}

function saveSelectedZodiac(value){
  try{localStorage.setItem(ZODIAC_KEY+session.code,value)}catch(e){}
}

function renderProfiles(){
  var warning=$("profileWarning");
  warning.style.display="none";
  warning.textContent="";

  if(!registeredBirth){
    $("registeredProfile").textContent="가입정보의 생년월일을 확인할 수 없습니다.";
    $("selectedProfile").textContent="출생년도 확인 후 계산할 수 있습니다.";
    warning.textContent="bus-seat 최신 버전으로 로그인한 뒤 다시 들어오면 가입정보가 연동됩니다.";
    warning.style.display="block";
    return null;
  }

  var registeredZodiac=zodiacForYear(registeredBirth.year);
  $("registeredProfile").textContent=profileText(
    registeredBirth.year,registeredBirth.month,registeredBirth.day,registeredZodiac
  );

  var selected=$("zodiacSelect").value;
  var adjustedYear=nearestYearForZodiac(registeredBirth.year,selected);

  $("selectedProfile").innerHTML=
    profileText(adjustedYear,registeredBirth.month,registeredBirth.day,selected)+
    (adjustedYear!==registeredBirth.year
      ? '<span class="sub">(가입년도 '+registeredBirth.year+'년 → '+adjustedYear+'년 보정)</span>'
      : '<span class="sub">(가입년도와 일치)</span>');

  return {
    selectedZodiac:selected,
    adjustedYear:adjustedYear,
    age:ageAtToday(adjustedYear,registeredBirth.month,registeredBirth.day)
  };
}

function renderFortune(){
  var profile=renderProfiles();
  var zodiac=$("zodiacSelect").value;

  var birthSeed=profile?String(profile.adjustedYear):"unknown";
  var seed=koreaDateKey()+"|"+session.code+"|"+birthSeed+"|"+zodiac;

  $("zodiacEmoji").textContent=zodiacEmoji[zodiac]||"🔮";
  $("heroTitle").textContent=zodiac+"띠 · 오늘의 총운";
