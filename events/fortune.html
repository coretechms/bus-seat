<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a2b75">
<title>오늘의 운세</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#222;background:#f4effa}
body{min-height:100vh;min-height:100dvh}
button,select{font-family:inherit}
.app{min-height:100vh;min-height:100dvh;padding:max(9px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:radial-gradient(circle at 15% 5%,rgba(255,255,255,.85),transparent 28%),linear-gradient(180deg,#eee3fa 0%,#faf8fd 48%,#f2edf7 100%)}
.shell{width:min(760px,100%);margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.title-wrap h1{margin:0;font-size:20px;font-weight:900;color:#4a2b75;letter-spacing:-.04em}
.date{margin-top:2px;font-size:11px;color:#776a84}
.actions{display:flex;gap:5px}
.top-btn{height:35px;min-width:58px;padding:0 10px;border:0;border-radius:12px;font-weight:900;font-size:12px;cursor:pointer}
.back{background:#fff;border:1px solid #cfc2dd;color:#59357d}
.exit{background:#3c2d50;color:#fff}

.birth-input-row{display:grid;grid-template-columns:1.45fr 1fr .62fr .62fr;gap:6px;align-items:end;margin-bottom:7px;padding:8px 9px;background:#fff;border:1px solid #e1d7eb;border-radius:14px;box-shadow:0 5px 16px rgba(60,40,80,.05)}
.birth-field{min-width:0}
.birth-field label{display:block;margin:0 0 3px;font-size:10px;font-weight:900;color:#5a347e;white-space:nowrap}
.birth-field select{width:100%;height:32px;border:1px solid #d5c8df;border-radius:9px;padding:0 6px;background:#fff;font-size:12px;font-weight:800;color:#352443}

.identity-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px}
.identity-zodiac,.identity-age{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:7px 10px;background:#fff;border:1px solid #e1d7eb;border-radius:14px;box-shadow:0 4px 12px rgba(60,40,80,.04)}
.identity-emoji{font-size:27px;line-height:1}
.identity-zodiac strong,.identity-age strong{font-size:15px;color:#4a2b75}
.identity-age span{font-size:11px;font-weight:800;color:#867791}

.total-fortune-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,#5c3784,#7a4da7);color:#fff;box-shadow:0 8px 20px rgba(78,44,110,.17);line-height:1.45}
.total-fortune-title{flex:0 0 auto;font-size:13px;white-space:nowrap}
.total-fortune-score{flex:0 0 auto;font-size:13px;color:#fff7b7;white-space:nowrap}
.total-fortune-summary{font-size:13px;font-weight:800;word-break:keep-all}

.grid{display:grid;grid-template-columns:1fr;gap:7px;margin-top:8px}
.card{background:#fff;border:1px solid #e6ddec;border-radius:15px;padding:10px;box-shadow:0 5px 16px rgba(60,40,80,.05)}
.card h3{margin:0 0 5px;font-size:12px;color:#5a347e}
.card p{margin:0;font-size:12px;line-height:1.45;color:#4d4654;word-break:keep-all}

.lucky{margin-top:8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lucky-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fff;border:1px solid #e2d7eb;border-radius:14px;padding:8px 5px;text-align:center;min-width:0}
.lucky-label{font-size:10px;color:#867791;margin-bottom:0;white-space:nowrap}
.lucky-value{font-size:12px;font-weight:900;color:#533276;white-space:nowrap}
.message{margin-top:8px;padding:11px;border-radius:15px;background:#fff8df;border:1px solid #eedb8e;color:#6d5700;text-align:center;font-size:12px;font-weight:900;line-height:1.45}
.notice{margin-top:7px;text-align:center;color:#8a7e92;font-size:9px;line-height:1.35}

@media(max-width:520px){
  .app{padding:max(6px,env(safe-area-inset-top)) 7px max(7px,env(safe-area-inset-bottom))}
  .topbar{margin-bottom:5px}
  .title-wrap h1{font-size:17px}
  .date{font-size:9px}
  .top-btn{height:31px;min-width:52px;padding:0 8px;font-size:11px}
  .grid{gap:5px;margin-top:6px}
  .card{padding:8px;border-radius:12px}
  .card h3{font-size:11px;margin-bottom:3px}
  .card p{font-size:11px;line-height:1.35}
  .lucky{margin-top:6px;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .lucky-box{padding:6px 2px;border-radius:11px;gap:2px}
  .lucky-label{font-size:9px}
  .lucky-value{font-size:11px}
  .message{margin-top:6px;padding:8px;font-size:11px}
  .notice{font-size:8px;margin-top:5px}

  .birth-input-row{grid-template-columns:1.45fr 1fr .58fr .58fr;gap:4px;padding:6px;margin-bottom:5px;border-radius:11px}
  .birth-field label{font-size:9px;margin-bottom:2px}
  .birth-field select{height:29px;padding:0 3px;font-size:10px}
  .identity-row{gap:5px;margin-bottom:5px}
  .identity-zodiac,.identity-age{min-height:39px;padding:5px 7px;border-radius:11px}
  .identity-emoji{font-size:22px}
  .identity-zodiac strong,.identity-age strong{font-size:13px}
  .identity-age span{font-size:9px}
  .total-fortune-row{gap:4px;margin-bottom:6px;padding:8px 9px;border-radius:11px;line-height:1.35}
  .total-fortune-title,.total-fortune-score,.total-fortune-summary{font-size:11px}
}
</style>
</head>

<script>

  "몸을 급하게 움직이기보다 가볍게 스트레칭하고 천천히 리듬을 올려보세요.",

];

var colors=["파랑","초록","노랑","주황","하늘색","보라","흰색","분홍","연두","남색"];
var times=["오전 8~10시","오전 10~12시","오후 1~3시","오후 3~5시","오후 5~7시"];
var messages=[
  "오늘도 좋은 사람들과 좋은 시간을 만들어 보세요.",
  "천천히 가도 괜찮습니다. 즐겁게 가는 것이 더 중요합니다.",
  "작은 웃음 하나가 하루의 분위기를 바꿀 수 있습니다.",
  "좋은 기분은 나누면 더 커집니다.",
  "오늘의 한 걸음이 내일의 좋은 기억이 됩니다.",

  "너무 완벽하려 하지 말고 오늘을 편안하게 즐겨보세요."
];

function $(id){return document.getElementById(id)}

function getKoreaNowParts(){
  try{
    var parts=new Intl.DateTimeFormat("en-CA",{
      timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"
    }).formatToParts(new Date());
    var m={};
    parts.forEach(function(p){m[p.type]=p.value});
    return {year:Number(m.year),month:Number(m.month),day:Number(m.day)};
  }catch(e){
    var d=new Date();
    return {year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate()};
  }
}

function koreaDateKey(){
  var p=getKoreaNowParts();
  return p.year+"-"+String(p.month).padStart(2,"0")+"-"+String(p.day).padStart(2,"0");
}

function displayDate(){
  try{
    return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
  }catch(e){return koreaDateKey()}
}

function normalizeSession(data){
  if(!data||typeof data!=="object")return null;
  return {
    code:String(data.code||data.memberCode||data.loginCode||data.id||"guest").trim()||"guest",
    name:String(data.name||data.memberName||data.userName||"회원").trim()||"회원",
    birthDate:String(data.birthDate||data.rrn||data.birth||data.birthYear||"").replace(/\D/g,"").slice(0,6)
  };
}

function loadSession(){
  try{
    var raw=sessionStorage.getItem(SESSION_KEY);
    if(raw)return normalizeSession(JSON.parse(raw));
  }catch(e){}
  return {code:"guest",name:"회원",birthDate:""};
}

function populateBirthSelectors(){
  var now=getKoreaNowParts();
  var yearSelect=$("birthYearSelect");
  var monthSelect=$("birthMonthSelect");
  var daySelect=$("birthDaySelect");

  yearSelect.innerHTML="";
  for(var y=now.year-100;y<=now.year;y++){
    var option=document.createElement("option");
    option.value=String(y);
    option.textContent=String(y);
    yearSelect.appendChild(option);
  }

  monthSelect.innerHTML="";
  for(var m=1;m<=12;m++){
    var monthOption=document.createElement("option");
    monthOption.value=String(m);
    monthOption.textContent=String(m);
    monthSelect.appendChild(monthOption);
  }

  daySelect.innerHTML="";
  for(var d=1;d<=31;d++){
    var dayOption=document.createElement("option");
    dayOption.value=String(d);
    dayOption.textContent=String(d);
    daySelect.appendChild(dayOption);
  }
}

function validDaysInMonth(year,month){
  return new Date(Number(year),Number(month),0).getDate();
}

function refreshBirthDays(){
  var year=Number($("birthYearSelect").value||1970);
  var month=Number($("birthMonthSelect").value||1);
  var daySelect=$("birthDaySelect");
  var previous=Math.max(1,Number(daySelect.value||1));
  var maxDay=validDaysInMonth(year,month);

  daySelect.innerHTML="";
  for(var day=1;day<=maxDay;day++){
    var option=document.createElement("option");
    option.value=String(day);
    option.textContent=String(day);
    daySelect.appendChild(option);
  }
  daySelect.value=String(Math.min(previous,maxDay));
}

function profileStorageKey(){
  return PROFILE_KEY+String(session&&session.code||"guest");
}

function loadManualProfile(){
  var now=getKoreaNowParts();
  var fallbackYear=now.year-50;
  var fallback={
    zodiac:zodiacForYear(fallbackYear),
    year:fallbackYear,
    month:1,
    day:1
  };

  try{
    var raw=localStorage.getItem(profileStorageKey());
    if(!raw)return fallback;
    var saved=JSON.parse(raw)||{};
    var year=Number(saved.year);
    var month=Number(saved.month);
    var day=Number(saved.day);

    if(!year||year<now.year-100||year>now.year)year=fallback.year;
    if(month<1||month>12)month=1;
    var maxDay=validDaysInMonth(year,month);
    if(day<1||day>maxDay)day=1;

    return {
      zodiac:zodiacOrder.indexOf(saved.zodiac)>=0?saved.zodiac:zodiacForYear(year),
      year:year,
      month:month,
      day:day
    };
  }catch(e){
    return fallback;
  }
}

function saveManualProfile(){
  var profile={
    zodiac:$("zodiacSelect").value,
    year:Number($("birthYearSelect").value),
    month:Number($("birthMonthSelect").value),
    day:Number($("birthDaySelect").value)
  };
  try{
    localStorage.setItem(profileStorageKey(),JSON.stringify(profile));
  }catch(e){}
  return profile;
}

function zodiacForYear(year){
  /* 한국 연도 기준 띠:
     1972년 = 쥐띠, 1973년 = 소띠
     이후 12년 주기로 반복 */
  var baseYear = 1972; // 쥐띠
  var idx = ((Number(year) - baseYear) % 12 + 12) % 12;
  return zodiacOrder[idx];
}

function ageAtToday(year,month,day){
  var now=getKoreaNowParts();
  var age=now.year-year;
  if(now.month<month || (now.month===month && now.day<day))age--;
  return age;
}

function hashText(text){
  var h=2166136261;
  for(var i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}

function pick(arr,seed,salt){
  return arr[hashText(seed+"|"+salt)%arr.length];
}

function renderFortune(){
  refreshBirthDays();

  var profile=saveManualProfile();
  var zodiac=profile.zodiac;
  var age=ageAtToday(profile.year,profile.month,profile.day);

  var seed=koreaDateKey()+"|"+String(session&&session.code||"guest")+"|"+
    profile.year+"|"+profile.month+"|"+profile.day+"|"+zodiac;

  var score=70+(hashText(seed+"|score")%30);

  $("zodiacEmoji").textContent=zodiacEmoji[zodiac]||"🔮";
  $("zodiacNameText").textContent=zodiac+"띠";
  $("ageText").textContent="만 "+age+"세";

  $("fortuneScore").textContent=score+"점";
  $("fortuneSummary").textContent=pick(summaries,seed,"summary");

  $("healthText").textContent=pick(health,seed,"health");
  $("moneyText").textContent=pick(money,seed,"money");
  $("relationText").textContent=pick(relation,seed,"relation");
  $("hikingText").textContent=pick(hiking,seed,"hiking");
