<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a2b75">
<title>오늘의 운세</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color:#2e2933;
  background:#f5f1f8;
}
body{min-height:100vh;min-height:100dvh}
button,select{font-family:inherit}

:root{
  --purple:#5d3c82;
  --purple-deep:#43285f;
  --line:#e4d8eb;
  --muted:#83788d;
  --shadow:0 8px 22px rgba(78,55,96,.09);
}

.app{
  min-height:100vh;
  min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.96),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(230,216,244,.72),transparent 28%),
    linear-gradient(180deg,#eee4f7 0%,#fbf9fd 47%,#f4f0f8 100%);
}
.shell{width:min(760px,100%);margin:0 auto}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.title-wrap h1{
  margin:0;
  font-size:24px;
  font-weight:900;
  color:var(--purple-deep);
  letter-spacing:-.04em;
}
.date{
  margin-top:3px;
  font-size:13px;
  font-weight:700;
  color:var(--muted);
}
.actions{display:flex;gap:7px}
.top-btn{
  height:40px;
  min-width:66px;
  padding:0 13px;
  border-radius:13px;
  font-weight:900;
  font-size:13px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(62,45,78,.06);
}
.back{background:#fff;border:1px solid #d8cae2;color:#5b3b7a}
.exit{border:1px solid var(--purple-deep);background:linear-gradient(135deg,#5a3c78,#3f2a55);color:#fff}

.birth-input-row{
  display:grid;
  grid-template-columns:.8fr 1.35fr .78fr .78fr;
  gap:8px;
  align-items:end;
  margin-bottom:5px;
  padding:11px;
  background:rgba(255,255,255,.97);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
}
.birth-field{min-width:0}
.birth-field label{
  display:block;
  margin:0 0 5px;
  font-size:12px;
  font-weight:900;
  color:var(--purple);
}
.birth-field select{
  width:100%;
  height:40px;
  border:1px solid #d8cbe1;
  border-radius:11px;
  padding:0 9px;
  background:#fff;
  font-size:15px;
  font-weight:900;
  color:#3b3043;
  outline:none;
}
.birth-field select:focus{
  border-color:#9c78bb;
  box-shadow:0 0 0 3px rgba(123,81,160,.10);
}

.calendar-convert-info{
  margin:4px 4px 5px;
  min-height:15px;
  text-align:center;
  font-size:11px;
  font-weight:800;
  color:#796989;
}
.calendar-convert-info strong{color:#5b3b78}

.profile-sync-status{
  margin:5px 4px 8px;
  text-align:right;
  font-size:11px;
  font-weight:700;
  color:#8c8095;
  min-height:14px;
}
.profile-sync-status.saved{color:#3d8755}
.profile-sync-status.error{color:#b75353}

.zodiac-visual-row{
  margin:0 0 8px;
}
.zodiac-visual-card{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:12px 14px;
  background:linear-gradient(135deg,#fff7e9,#fffdf6);
  border:1px solid #eadfbe;
  border-radius:16px;
  box-shadow:0 8px 18px rgba(105,85,40,.08);
}
.zodiac-emoji{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#fffefb,#fbe8ae);
  border:1px solid #ecd992;
  font-size:31px;
  line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 3px 8px rgba(125,96,29,.08);
}
.zodiac-info{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
}
.zodiac-label{
  font-size:12px;
  font-weight:800;
  color:#9a8557;
}
.zodiac-info strong{
  font-size:18px;
  font-weight:900;
  color:#6b4b1d;
}

.age-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:0 0 8px;
  padding:10px 12px;
  background:rgba(255,255,255,.97);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:var(--shadow);
  color:var(--purple-deep);
}
.age-row strong{
  font-size:15px;
  font-weight:900;
}
.age-divider{
  color:#b5a8bf;
  font-size:14px;
  font-weight:900;
}

.total-fortune-row{
  margin-bottom:9px;
  padding:14px 15px;
  border-radius:18px;
  background:
    radial-gradient(circle at 90% 0%,rgba(255,255,255,.13),transparent 28%),
    linear-gradient(135deg,#5d3b82,#7b4da7);
  color:#fff;
  box-shadow:0 10px 24px rgba(78,44,110,.18);
}
.total-fortune-head{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:7px;
}
.total-fortune-title{
  font-size:16px;
  font-weight:900;
}
.total-fortune-score{
  font-size:18px;
  font-weight:900;
  color:#fff0a8;
}
.total-fortune-summary{
  padding-left:10px;
  font-size:15px;
  font-weight:800;
  line-height:1.55;
  word-break:keep-all;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:7px;
  margin-top:0;
}
.card{
  background:rgba(255,255,255,.98);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px 14px;
  box-shadow:var(--shadow);
}
.card h3{
  margin:0 0 6px;
  font-size:16px;
  font-weight:900;
  color:var(--purple);
}
.card p{
  margin:0;
  padding-left:8px;
  font-size:14px;
  font-weight:700;
  line-height:1.55;
  color:#4e4655;
  word-break:keep-all;
}

.lucky{
  margin-top:8px;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}
.lucky-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-height:70px;
  padding:9px 5px;
  background:linear-gradient(180deg,#fffefb,#fff8e9);
  border:1px solid #eadfbe;
  border-radius:15px;
  box-shadow:0 6px 16px rgba(104,83,42,.06);
}
.lucky-label{
  font-size:12px;
  font-weight:900;
  color:#988662;
  white-space:nowrap;
}
.lucky-value{
  font-size:15px;
  font-weight:900;
  color:#6a4b1d;
  white-space:nowrap;
}

.message{
  margin-top:8px;
  padding:12px 14px;
  border-radius:16px;
  background:linear-gradient(135deg,#fff9df,#fff4c7);
  border:1px solid #ecd992;
  color:#725b05;
  text-align:center;
  font-size:14px;
  font-weight:900;
  line-height:1.5;
}
.notice{
  margin-top:7px;
  padding:0 6px;
  text-align:center;
  color:#91869a;
  font-size:10px;
  line-height:1.45;
}

@media(max-width:520px){
  .app{

    border-radius:11px;

    border-radius:9px;

  .calendar-convert-info{
    margin:3px 2px 4px;

    line-height:1.35;
  }

  .profile-sync-status{

  .zodiac-visual-row{

  .total-fortune-summary{

    font-size:13px;
    line-height:1.5;
  }

  .grid{gap:6px}
  .card{
    padding:10px 11px;
    border-radius:13px;
  }
  .card h3{
    font-size:14px;
    margin-bottom:4px;
  }
  .card p{
    padding-left:7px;
    font-size:13px;
    line-height:1.5;
  }

  .lucky{
    margin-top:7px;
    gap:5px;
  }
  .lucky-box{
    min-height:58px;
    padding:7px 3px;
    border-radius:12px;
    gap:3px;
  }
  .lucky-label{font-size:10px}
  .lucky-value{font-size:13px}

  .message{
    margin-top:7px;
    padding:10px 11px;
    border-radius:13px;
    font-size:13px;
  }
  .notice{margin-top:6px;font-size:9px}
}
</style>
</head>

function $(id){return document.getElementById(id)}

function getKoreaNowParts(){
  try{
    var parts=new Intl.DateTimeFormat("en-CA",{
      timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"
    }).formatToParts(new Date());
    var m={};
    parts.forEach(function(p){m[p.type]=p.value});
    return {year:Number(m.year),month:Number(m.month),day:Number(m.day)};
  }catch(e){
    var d=new Date();
    return {year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate()};
  }
}

function koreaDateKey(){
  var p=getKoreaNowParts();
  return p.year+"-"+String(p.month).padStart(2,"0")+"-"+String(p.day).padStart(2,"0");
}

function displayDate(){
  try{
    return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
  }catch(e){return koreaDateKey()}
}

  return {

  }
  setProfileSyncStatus("회원정보 확인중...");
  try{
    if(window.parent && window.parent!==window){
      window.parent.postMessage({
        type:"BUS_SEAT_FORTUNE_PROFILE_GET",
        event:"fortune"
      },"*");

function saveRemoteProfile(profile){
  if(!session || !session.code || session.code==="guest" || session.code==="ADMIN"){
    setProfileSyncStatus("이 기기에 저장됨","saved");
    return;
  }
  setProfileSyncStatus("저장중...");
  try{
    if(window.parent && window.parent!==window){
      window.parent.postMessage({
        type:"BUS_SEAT_FORTUNE_PROFILE_SAVE",
        event:"fortune",
        profile:{
          zodiac:String(profile.zodiac||""),
          calendarType:String(profile.calendarType||"solar"),
          birthYear:Number(profile.year),
          birthMonth:Number(profile.month),
          lunarMonthKey:String(profile.lunarMonthKey||""),
          birthDay:Number(profile.day)
        }
      },"*");
    }
  }catch(e){
    setProfileSyncStatus("서버 저장 실패 · 이 기기에는 저장됨","error");
  }
}

function applyRemoteProfile(profile){
  if(!profile || typeof profile!=="object")return false;

  var calendarType=String(profile.calendarType||"solar")==="lunar"?"lunar":"solar";
  var year=Number(profile.birthYear);
  var month=Number(profile.birthMonth);
  var day=Number(profile.birthDay);
  var lunarMonthKey=String(profile.lunarMonthKey||month||"");
  var now=getKoreaNowParts();

  if(!year || year<now.year-100 || year>now.year)return false;
  if(day<1 || day>31)return false;

  $("calendarTypeSelect").value=calendarType;
  $("birthYearSelect").value=String(year);
  refreshMonthAndDaySelectors({
    monthValue: calendarType==="lunar" ? lunarMonthKey : String(month),
    dayValue: day
  });

  try{
    localStorage.setItem(profileStorageKey(),JSON.stringify({
      calendarType:calendarType,
      year:year,
      month:month,
      lunarMonthKey:calendarType==="lunar"?lunarMonthKey:"",
      day:day
    }));
  }catch(e){}

  renderFortune(false);
  return true;
}

window.addEventListener("message",function(event){
  var data=event.data||{};

  if(data.type==="BUS_SEAT_EVENT_SESSION" && data.session){
    session=normalizeSession(data.session)||session;

  if(data.type==="BUS_SEAT_FORTUNE_PROFILE_DATA"){

      }

    }else{
      setProfileSyncStatus("서버정보 없음 · 이 기기 저장값 사용","error");
    }
    return;
  }

  if(data.type==="BUS_SEAT_FORTUNE_PROFILE_SAVED"){

    }else{
      setProfileSyncStatus("서버 저장 실패 · 이 기기에는 저장됨","error");
    }
  }
});

function chineseCalendarParts(date){
  try{
    var parts=new Intl.DateTimeFormat("en-u-ca-chinese",{
      timeZone:"Asia/Seoul",
      year:"numeric",
      month:"numeric",
      day:"numeric"
    }).formatToParts(date);
    var out={};
    parts.forEach(function(p){
      if(p.type!=="literal")out[p.type]=p.value;
    });
    return {
      year:Number(out.relatedYear||out.year||0),
      monthKey:String(out.month||""),
      month:Number(String(out.month||"").replace(/\D/g,"")||0),
      leap:String(out.month||"").indexOf("bis")>=0,
      day:Number(out.day||0)
    };
  }catch(e){
    return null;
  }
}

function makeSolarDate(year,month,day){
  return new Date(Date.UTC(Number(year),Number(month)-1,Number(day),3,0,0));
}

function solarToLunar(year,month,day){
  return chineseCalendarParts(makeSolarDate(year,month,day));
}

function scanLunarYear(lunarYear){
  var result={months:[],dateMap:{}};
  var seen={};
  var start=new Date(Date.UTC(Number(lunarYear)-1,11,1,3,0,0));
  var end=new Date(Date.UTC(Number(lunarYear)+1,2,31,3,0,0));

  for(var d=new Date(start);d<=end;d.setUTCDate(d.getUTCDate()+1)){
    var parts=chineseCalendarParts(d);
    if(!parts || parts.year!==Number(lunarYear))continue;

    var key=parts.monthKey;
    if(!seen[key]){
      seen[key]={key:key,month:parts.month,leap:parts.leap,maxDay:parts.day};
      result.months.push(seen[key]);
    }else{
      seen[key].maxDay=Math.max(seen[key].maxDay,parts.day);
    }

    result.dateMap[key+"|"+parts.day]={
      year:d.getUTCFullYear(),
      month:d.getUTCMonth()+1,
      day:d.getUTCDate()
    };
  }

  return result;
}

var lunarYearCache={};
function getLunarYearInfo(year){
  var key=String(year);
  if(!lunarYearCache[key])lunarYearCache[key]=scanLunarYear(year);
  return lunarYearCache[key];
}

function lunarToSolar(year,monthKey,day){
  var info=getLunarYearInfo(year);
  return info.dateMap[String(monthKey)+"|"+Number(day)]||null;
}

function populateBirthYearSelector(){
  var now=getKoreaNowParts();
  var yearSelect=$("birthYearSelect");
  yearSelect.innerHTML="";
  for(var y=now.year-100;y<=now.year;y++){
    var option=document.createElement("option");
    option.value=String(y);
    option.textContent=String(y);
    yearSelect.appendChild(option);
  }
}

function validDaysInMonth(year,month){
  return new Date(Number(year),Number(month),0).getDate();
}

function refreshMonthAndDaySelectors(preferred){
  preferred=preferred||{};
  var type=$("calendarTypeSelect").value==="lunar"?"lunar":"solar";
  var year=Number($("birthYearSelect").value||1972);
  var monthSelect=$("birthMonthSelect");
  var daySelect=$("birthDaySelect");

  var previousMonth=String(preferred.monthValue||monthSelect.value||"1");
  var previousDay=Math.max(1,Number(preferred.dayValue||daySelect.value||1));

  monthSelect.innerHTML="";

  if(type==="lunar"){
    var info;
    try{ info=getLunarYearInfo(year); }catch(e){ info={months:[],dateMap:{}}; }

    /* 일부 구형 WebView에서 중국력 Intl 지원이 없더라도 입력 UI와 운세가 멈추지 않도록 기본 12개월 제공 */
    if(!info.months || !info.months.length){
      info={months:[],dateMap:{}};
      for(var fm=1;fm<=12;fm++){
        info.months.push({key:String(fm),month:fm,leap:false,maxDay:30});
      }
    }

    info.months.forEach(function(item){
      var option=document.createElement("option");
      option.value=item.key;
      option.textContent=(item.leap?"윤":"")+item.month+"월";
      monthSelect.appendChild(option);
    });
    if(Array.from(monthSelect.options).some(function(o){return o.value===previousMonth})){
      monthSelect.value=previousMonth;
    }else if(monthSelect.options.length){
      monthSelect.selectedIndex=0;
    }

    var selected=info.months.find(function(item){return item.key===monthSelect.value})||info.months[0];
    var maxDay=selected?selected.maxDay:30;
    daySelect.innerHTML="";
    for(var ld=1;ld<=maxDay;ld++){
      var lo=document.createElement("option");
      lo.value=String(ld);
      lo.textContent=String(ld);
      daySelect.appendChild(lo);
    }
    daySelect.value=String(Math.min(previousDay,maxDay));
  }else{
    for(var m=1;m<=12;m++){
      var option=document.createElement("option");
      option.value=String(m);
      option.textContent=String(m)+"월";
      monthSelect.appendChild(option);
    }
    var monthNumber=Math.min(12,Math.max(1,Number(previousMonth.replace(/\D/g,"")||1)));
    monthSelect.value=String(monthNumber);

    var maxSolarDay=validDaysInMonth(year,monthNumber);
    daySelect.innerHTML="";
    for(var sd=1;sd<=maxSolarDay;sd++){
      var so=document.createElement("option");
      so.value=String(sd);
      so.textContent=String(sd);
      daySelect.appendChild(so);
    }
    daySelect.value=String(Math.min(previousDay,maxSolarDay));
  }
}

function resolveBirthContext(){
  var type=$("calendarTypeSelect").value==="lunar"?"lunar":"solar";
  var year=Number($("birthYearSelect").value||1972);
  var monthKey=String($("birthMonthSelect").value||"1");
  var day=Number($("birthDaySelect").value||1);

  if(type==="lunar"){
    var monthNumber=Number(monthKey.replace(/\D/g,"")||1);
    var solar=null;
    try{ solar=lunarToSolar(year,monthKey,day); }catch(e){ solar=null; }
    return {
      calendarType:"lunar",
      year:year,
      month:monthNumber,
      lunarMonthKey:monthKey,
      day:day,
      zodiacYear:year,
      solar:solar
    };
  }

  var month=Number(monthKey||1);
  var lunar=null;
  try{ lunar=solarToLunar(year,month,day); }catch(e){ lunar=null; }

  return {
    calendarType:"solar",
    year:year,
    month:month,
    lunarMonthKey:"",
    day:day,
    /* 양력 생일은 해당 날짜가 속한 음력 연도의 십이지를 사용한다.
       예: 1973-01-01은 음력 1972년 -> 쥐띠,
           1973-02-03부터 음력 1973년 -> 소띠. */
    zodiacYear:lunar&&lunar.year?lunar.year:year,
    solar:{year:year,month:month,day:day},
    lunar:lunar
  };
}

function updateCalendarConvertInfo(context){
  var el=$("calendarConvertInfo");
  if(!el || !context)return;

  if(context.calendarType==="lunar"){
    var lunarLabel=(String(context.lunarMonthKey).indexOf("bis")>=0?"윤":"")+context.month+"월 "+context.day+"일";
    if(context.solar){
      el.innerHTML="음력 "+context.year+"년 "+lunarLabel+
        " → <strong>양력 "+context.solar.year+"."+String(context.solar.month).padStart(2,"0")+"."+String(context.solar.day).padStart(2,"0")+"</strong>";
    }else{
      el.textContent="음력 날짜를 확인할 수 없습니다.";
    }
  }else if(context.lunar){
    var lunarLabel2=(context.lunar.leap?"윤":"")+context.lunar.month+"월 "+context.lunar.day+"일";
    el.innerHTML="양력 "+context.year+"."+String(context.month).padStart(2,"0")+"."+String(context.day).padStart(2,"0")+
      " → <strong>음력 "+context.lunar.year+"년 "+lunarLabel2+"</strong>";
  }else{
    el.textContent="";
  }
}

function profileStorageKey(){
  return PROFILE_KEY+String(session&&session.code||"guest");
}

function loadManualProfile(){
  var now=getKoreaNowParts();
  var fallbackYear=now.year-50;
  var fallback={
    calendarType:"solar",
    year:fallbackYear,
    month:1,
    lunarMonthKey:"",
    day:1
  };

  try{
    var raw=localStorage.getItem(profileStorageKey());
    if(!raw)return fallback;
    var saved=JSON.parse(raw)||{};
    var year=Number(saved.year);
    var month=Number(saved.month);
    var day=Number(saved.day);
    var calendarType=String(saved.calendarType||"solar")==="lunar"?"lunar":"solar";
    var lunarMonthKey=String(saved.lunarMonthKey||month||"");

    if(!year||year<now.year-100||year>now.year)year=fallback.year;
    if(month<1||month>12)month=1;
    if(day<1||day>31)day=1;

    return {
      calendarType:calendarType,
      year:year,
      month:month,
      lunarMonthKey:calendarType==="lunar"?lunarMonthKey:"",
      day:day
    };
  }catch(e){
    return fallback;
  }
}
function saveManualProfile(){
  var context=resolveBirthContext();
  var profile={
    calendarType:context.calendarType,
    zodiac:zodiacForYear(context.zodiacYear),
    year:context.year,
    month:context.month,
    lunarMonthKey:context.lunarMonthKey||"",
    day:context.day,
    solar:context.solar||null
  };
  try{
    localStorage.setItem(profileStorageKey(),JSON.stringify(profile));
  }catch(e){}
  return profile;
}
function zodiacForYear(year){
  /* 한국 연도 기준 띠:
     1972년 = 쥐띠, 1973년 = 소띠
     이후 12년 주기로 반복 */
  var baseYear = 1972; // 쥐띠
  var idx = ((Number(year) - baseYear) % 12 + 12) % 12;
  return zodiacOrder[idx];
}

function ageAtToday(year,month,day){
  var now=getKoreaNowParts();
  var age=now.year-year;
  if(now.month<month || (now.month===month && now.day<day))age--;
  return age;
}

function yearAge(year){
  var now=getKoreaNowParts();
  return now.year-Number(year);
}

function hashText(text){
  var h=2166136261;
  for(var i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}

function pick(arr,seed,salt){
  return arr[hashText(seed+"|"+salt)%arr.length];
}

function renderFortune(syncRemote){
  var context;
  try{
    context=resolveBirthContext();
  }catch(e){
    var fallbackYear=Number($("birthYearSelect").value||1972);
    var fallbackMonth=Number(String($("birthMonthSelect").value||"1").replace(/\D/g,"")||1);
    var fallbackDay=Number($("birthDaySelect").value||1);
    context={
      calendarType:$("calendarTypeSelect").value==="lunar"?"lunar":"solar",
      year:fallbackYear,
      month:fallbackMonth,
      lunarMonthKey:"",
      day:fallbackDay,
      zodiacYear:fallbackYear,
      solar:{year:fallbackYear,month:fallbackMonth,day:fallbackDay},
      lunar:null
    };
  }

  var zodiac=zodiacForYear(context.zodiacYear);
  var profile={
    calendarType:context.calendarType,
    zodiac:zodiac,
    year:context.year,
    month:context.month,
    lunarMonthKey:context.lunarMonthKey||"",
    day:context.day,
    solar:context.solar||null
  };

  try{
    localStorage.setItem(profileStorageKey(),JSON.stringify(profile));
  }catch(e){}

  try{ updateCalendarConvertInfo(context); }catch(e){}

  $("zodiacEmoji").textContent=zodiacEmoji[zodiac]||"🔮";
  $("zodiacNameText").textContent=zodiac+"띠";

  var ageBase=context.solar||{year:profile.year,month:profile.month,day:profile.day};
  var fullAge=ageAtToday(ageBase.year,ageBase.month,ageBase.day);
  var simpleYearAge=yearAge(ageBase.year);

  $("fullAgeText").textContent="만 "+fullAge+"세";
  $("yearAgeText").textContent="연나이 "+simpleYearAge+"세";

  var seed=koreaDateKey()+"|"+String(session&&session.code||"guest")+"|"+
    profile.calendarType+"|"+profile.year+"|"+profile.month+"|"+profile.lunarMonthKey+"|"+profile.day+"|"+zodiac;

  var score=70+(hashText(seed+"|score")%30);

  $("fortuneScore").textContent=score+"점";
  $("fortuneSummary").textContent=pick(summaries,seed,"summary");
  $("healthText").textContent=pick(health,seed,"health");
  $("moneyText").textContent=pick(money,seed,"money");
  $("relationText").textContent=pick(relation,seed,"relation");
  $("hikingText").textContent=pick(hiking,seed,"hiking");
  $("colorText").textContent=pick(colors,seed,"color");
  $("numberText").textContent=String(1+(hashText(seed+"|number")%9));
  $("timeText").textContent=pick(times,seed,"time");
  $("messageText").textContent="✨ "+pick(messages,seed,"message");

  if(syncRemote!==false){
    saveRemoteProfile(profile);
  }
}
