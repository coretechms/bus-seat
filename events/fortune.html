<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a2b75">
<title>오늘의 운세</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color:#2e2933;
  background:#f5f1f8;
}
body{min-height:100vh;min-height:100dvh}
button,select{font-family:inherit}

:root{
  --purple:#5d3c82;
  --purple-deep:#43285f;
  --line:#e4d8eb;
  --muted:#83788d;
  --shadow:0 8px 22px rgba(78,55,96,.09);
}

.app{
  min-height:100vh;
  min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.96),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(230,216,244,.72),transparent 28%),
    linear-gradient(180deg,#eee4f7 0%,#fbf9fd 47%,#f4f0f8 100%);
}
.shell{width:min(760px,100%);margin:0 auto}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.title-wrap h1{
  margin:0;
  font-size:24px;
  font-weight:900;
  color:var(--purple-deep);
  letter-spacing:-.04em;
}
.date{
  margin-top:3px;
  font-size:13px;
  font-weight:700;
  color:var(--muted);
}
.actions{display:flex;gap:7px}
.top-btn{
  height:40px;
  min-width:66px;
  padding:0 13px;
  border-radius:13px;
  font-weight:900;
  font-size:13px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(62,45,78,.06);
}
.back{background:#fff;border:1px solid #d8cae2;color:#5b3b7a}
.exit{border:1px solid var(--purple-deep);background:linear-gradient(135deg,#5a3c78,#3f2a55);color:#fff}

.birth-input-row{
  display:grid;
  grid-template-columns:1.5fr .75fr .75fr;
  gap:8px;
  align-items:end;
  margin-bottom:5px;
  padding:11px;
  background:rgba(255,255,255,.97);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
}
.birth-field{min-width:0}
.birth-field label{
  display:block;
  margin:0 0 5px;
  font-size:12px;
  font-weight:900;
  color:var(--purple);
}
.birth-field select{
  width:100%;
  height:40px;
  border:1px solid #d8cbe1;
  border-radius:11px;
  padding:0 9px;
  background:#fff;
  font-size:15px;
  font-weight:900;
  color:#3b3043;
  outline:none;
}
.birth-field select:focus{
  border-color:#9c78bb;
  box-shadow:0 0 0 3px rgba(123,81,160,.10);
}

.profile-sync-status{
  margin:5px 4px 8px;
  text-align:right;
  font-size:11px;
  font-weight:700;
  color:#8c8095;
  min-height:14px;
}
.profile-sync-status.saved{color:#3d8755}
.profile-sync-status.error{color:#b75353}

.zodiac-visual-row{
  margin:0 0 8px;
}
.zodiac-visual-card{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:12px 14px;
  background:linear-gradient(135deg,#fff7e9,#fffdf6);
  border:1px solid #eadfbe;
  border-radius:16px;
  box-shadow:0 8px 18px rgba(105,85,40,.08);
}
.zodiac-emoji{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#fffefb,#fbe8ae);
  border:1px solid #ecd992;
  font-size:31px;
  line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 3px 8px rgba(125,96,29,.08);
}
.zodiac-info{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
}
.zodiac-label{
  font-size:12px;
  font-weight:800;
  color:#9a8557;
}
.zodiac-info strong{
  font-size:18px;
  font-weight:900;
  color:#6b4b1d;
}

.age-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:0 0 8px;
  padding:10px 12px;
  background:rgba(255,255,255,.97);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:var(--shadow);
  color:var(--purple-deep);
}
.age-row strong{
  font-size:15px;
  font-weight:900;
}
.age-divider{
  color:#b5a8bf;
  font-size:14px;
  font-weight:900;
}

.total-fortune-row{
  margin-bottom:9px;
  padding:14px 15px;
  border-radius:18px;
  background:
    radial-gradient(circle at 90% 0%,rgba(255,255,255,.13),transparent 28%),
    linear-gradient(135deg,#5d3b82,#7b4da7);
  color:#fff;
  box-shadow:0 10px 24px rgba(78,44,110,.18);
}
.total-fortune-head{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:7px;
}
.total-fortune-title{
  font-size:16px;
  font-weight:900;
}
.total-fortune-score{
  font-size:18px;
  font-weight:900;
  color:#fff0a8;
}
.total-fortune-summary{
  padding-left:10px;
  font-size:15px;
  font-weight:800;
  line-height:1.55;
  word-break:keep-all;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:7px;
  margin-top:0;
}
.card{
  background:rgba(255,255,255,.98);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px 14px;
  box-shadow:var(--shadow);
}
.card h3{
  margin:0 0 6px;
  font-size:16px;
  font-weight:900;
  color:var(--purple);
}
.card p{
  margin:0;
  padding-left:8px;
  font-size:14px;
  font-weight:700;
  line-height:1.55;
  color:#4e4655;
  word-break:keep-all;
}

.lucky{
  margin-top:8px;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}
.lucky-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-height:70px;
  padding:9px 5px;
  background:linear-gradient(180deg,#fffefb,#fff8e9);
  border:1px solid #eadfbe;
  border-radius:15px;
  box-shadow:0 6px 16px rgba(104,83,42,.06);
}
.lucky-label{
  font-size:12px;
  font-weight:900;
  color:#988662;
  white-space:nowrap;
}
.lucky-value{
  font-size:15px;
  font-weight:900;
  color:#6a4b1d;
  white-space:nowrap;
}

.message{
  margin-top:8px;
  padding:12px 14px;
  border-radius:16px;
  background:linear-gradient(135deg,#fff9df,#fff4c7);
  border:1px solid #ecd992;
  color:#725b05;
  text-align:center;
  font-size:14px;
  font-weight:900;
  line-height:1.5;
}
.notice{
  margin-top:7px;
  padding:0 6px;
  text-align:center;
  color:#91869a;
  font-size:10px;
  line-height:1.45;
}

@media(max-width:520px){
  .app{
    padding:max(8px,env(safe-area-inset-top)) 8px max(9px,env(safe-area-inset-bottom));
  }
  .topbar{margin-bottom:7px}
  .title-wrap h1{font-size:20px}
  .date{font-size:11px}
  .top-btn{
    height:35px;
    min-width:58px;
    padding:0 10px;
    border-radius:11px;
    font-size:12px;
  }

  .birth-input-row{
    grid-template-columns:1.45fr .72fr .72fr;
    gap:5px;
    padding:8px;
    border-radius:14px;
  }
  .birth-field label{font-size:11px;margin-bottom:3px}
  .birth-field select{
    height:36px;
    padding:0 5px;
    font-size:13px;
    border-radius:9px;
  }

  .profile-sync-status{
    margin:4px 3px 6px;
    font-size:10px;
  }

  .zodiac-visual-row{
    margin-bottom:6px;
  }
  .zodiac-visual-card{
    gap:9px;
    padding:10px 11px;
    border-radius:13px;
  }
  .zodiac-emoji{
    width:46px;
    height:46px;
    font-size:25px;
  }
  .zodiac-label{font-size:10px}
  .zodiac-info strong{font-size:15px}

  .age-row{
    gap:8px;
    margin-bottom:6px;
    padding:8px 10px;
    border-radius:12px;
  }
  .age-row strong{font-size:13px}
  .age-divider{font-size:12px}

  .total-fortune-row{
    margin-bottom:7px;
    padding:11px 12px;
    border-radius:14px;
  }
  .total-fortune-head{
    margin-bottom:5px;
    gap:5px;
  }
  .total-fortune-title{font-size:14px}
  .total-fortune-score{font-size:16px}
  .total-fortune-summary{
    padding-left:8px;
    font-size:13px;
    line-height:1.5;
  }

  .grid{gap:6px}
  .card{
    padding:10px 11px;
    border-radius:13px;
  }
  .card h3{
    font-size:14px;
    margin-bottom:4px;
  }
  .card p{
    padding-left:7px;
    font-size:13px;
    line-height:1.5;
  }

  .lucky{
    margin-top:7px;
    gap:5px;
  }
  .lucky-box{
    min-height:58px;
    padding:7px 3px;
    border-radius:12px;
    gap:3px;
  }
  .lucky-label{font-size:10px}
  .lucky-value{font-size:13px}

  .message{
    margin-top:7px;
    padding:10px 11px;
    border-radius:13px;
    font-size:13px;
  }
  .notice{margin-top:6px;font-size:9px}
}
</style>
</head>

function $(id){return document.getElementById(id)}

function getKoreaNowParts(){
  try{
    var parts=new Intl.DateTimeFormat("en-CA",{
      timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"
    }).formatToParts(new Date());
    var m={};
    parts.forEach(function(p){m[p.type]=p.value});
    return {year:Number(m.year),month:Number(m.month),day:Number(m.day)};
  }catch(e){
    var d=new Date();
    return {year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate()};
  }
}

function koreaDateKey(){
  var p=getKoreaNowParts();
  return p.year+"-"+String(p.month).padStart(2,"0")+"-"+String(p.day).padStart(2,"0");
}

function displayDate(){
  try{
    return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date());
  }catch(e){return koreaDateKey()}
}

function normalizeSession(data){
  if(!data||typeof data!=="object")return null;
  return {
    code:String(data.code||data.memberCode||data.loginCode||data.id||"guest").trim()||"guest",
    name:String(data.name||data.memberName||data.userName||"회원").trim()||"회원",
    birthDate:String(data.birthDate||data.rrn||data.birth||data.birthYear||"").replace(/\D/g,"").slice(0,6)
  };
}

function loadSession(){
  try{
    var raw=sessionStorage.getItem(SESSION_KEY);
    if(raw)return normalizeSession(JSON.parse(raw));
  }catch(e){}
  return {code:"guest",name:"회원",birthDate:""};
}

function setProfileSyncStatus(message,type){
  var el=$("profileSyncStatus");
  if(!el)return;
  el.textContent=message||"";
  el.classList.remove("saved","error");
  if(type)el.classList.add(type);
}

function requestRemoteProfile(){
  if(!session || !session.code || session.code==="guest" || session.code==="ADMIN"){
    setProfileSyncStatus("회원 로그인 시 자동 저장됩니다.");
    return;
  }
  setProfileSyncStatus("회원정보 확인중...");
  try{
    if(window.parent && window.parent!==window){
      window.parent.postMessage({
        type:"BUS_SEAT_FORTUNE_PROFILE_GET",
        event:"fortune"
      },"*");
    }
  }catch(e){
    setProfileSyncStatus("회원정보 확인 실패","error");
  }
}

function saveRemoteProfile(profile){
  if(!session || !session.code || session.code==="guest" || session.code==="ADMIN"){
    setProfileSyncStatus("이 기기에 저장됨","saved");
    return;
  }
  setProfileSyncStatus("저장중...");
  try{
    if(window.parent && window.parent!==window){
      window.parent.postMessage({
        type:"BUS_SEAT_FORTUNE_PROFILE_SAVE",
        event:"fortune",
        profile:{
          zodiac:String(profile.zodiac||""),
          birthYear:Number(profile.year),
          birthMonth:Number(profile.month),
          birthDay:Number(profile.day)
        }
      },"*");
    }
  }catch(e){
    setProfileSyncStatus("서버 저장 실패 · 이 기기에는 저장됨","error");
  }
}

function applyRemoteProfile(profile){
  if(!profile || typeof profile!=="object")return false;

  var zodiac=String(profile.zodiac||"");
  var year=Number(profile.birthYear);
  var month=Number(profile.birthMonth);
  var day=Number(profile.birthDay);
  var now=getKoreaNowParts();

  if(!year || year<now.year-100 || year>now.year)return false;
  zodiac=zodiacForYear(year);
  if(month<1 || month>12)return false;
  if(day<1 || day>validDaysInMonth(year,month))return false;

  $("birthYearSelect").value=String(year);
  $("birthMonthSelect").value=String(month);
  refreshBirthDays();
  $("birthDaySelect").value=String(day);

  try{
    localStorage.setItem(profileStorageKey(),JSON.stringify({
      zodiac:zodiac,
      year:year,
      month:month,
      day:day
    }));
  }catch(e){}

  renderFortune(false);
  return true;
}

window.addEventListener("message",function(event){
  var data=event.data||{};

  if(data.type==="BUS_SEAT_EVENT_SESSION" && data.session){
    session=normalizeSession(data.session)||session;
    requestRemoteProfile();
    return;
  }

  if(data.type==="BUS_SEAT_FORTUNE_PROFILE_DATA"){
    if(data.ok && data.profile){
      if(applyRemoteProfile(data.profile)){
        setProfileSyncStatus("회원정보 자동 불러오기 완료","saved");
      }else{
        setProfileSyncStatus("저장된 회원정보 형식 오류","error");
      }
    }else if(data.ok && !data.profile){
      setProfileSyncStatus("최초 1회 입력하면 회원정보로 저장됩니다.");
    }else{
      setProfileSyncStatus("서버정보 없음 · 이 기기 저장값 사용","error");
    }
    return;
  }

  if(data.type==="BUS_SEAT_FORTUNE_PROFILE_SAVED"){
    if(data.ok){
      setProfileSyncStatus("회원정보 저장됨","saved");
    }else{
      setProfileSyncStatus("서버 저장 실패 · 이 기기에는 저장됨","error");
    }
  }
});

function populateBirthSelectors(){
  var now=getKoreaNowParts();
  var yearSelect=$("birthYearSelect");
  var monthSelect=$("birthMonthSelect");
  var daySelect=$("birthDaySelect");

  yearSelect.innerHTML="";
  for(var y=now.year-100;y<=now.year;y++){
    var option=document.createElement("option");
    option.value=String(y);
    option.textContent=String(y);
    yearSelect.appendChild(option);
  }

  monthSelect.innerHTML="";
  for(var m=1;m<=12;m++){
    var monthOption=document.createElement("option");
    monthOption.value=String(m);
    monthOption.textContent=String(m);
    monthSelect.appendChild(monthOption);
  }

  daySelect.innerHTML="";
  for(var d=1;d<=31;d++){
    var dayOption=document.createElement("option");
    dayOption.value=String(d);
    dayOption.textContent=String(d);
    daySelect.appendChild(dayOption);
  }
}

function validDaysInMonth(year,month){
  return new Date(Number(year),Number(month),0).getDate();
}

function refreshBirthDays(){
  var year=Number($("birthYearSelect").value||1970);
  var month=Number($("birthMonthSelect").value||1);
  var daySelect=$("birthDaySelect");
  var previous=Math.max(1,Number(daySelect.value||1));
  var maxDay=validDaysInMonth(year,month);

  daySelect.innerHTML="";
  for(var day=1;day<=maxDay;day++){
    var option=document.createElement("option");
    option.value=String(day);
    option.textContent=String(day);
    daySelect.appendChild(option);
  }
  daySelect.value=String(Math.min(previous,maxDay));
}

function profileStorageKey(){
  return PROFILE_KEY+String(session&&session.code||"guest");
}

function loadManualProfile(){
  var now=getKoreaNowParts();
  var fallbackYear=now.year-50;
  var fallback={
    zodiac:zodiacForYear(fallbackYear),
    year:fallbackYear,
    month:1,
    day:1
  };

  try{
    var raw=localStorage.getItem(profileStorageKey());
    if(!raw)return fallback;
    var saved=JSON.parse(raw)||{};
    var year=Number(saved.year);
    var month=Number(saved.month);
    var day=Number(saved.day);

    if(!year||year<now.year-100||year>now.year)year=fallback.year;
    if(month<1||month>12)month=1;
    var maxDay=validDaysInMonth(year,month);
    if(day<1||day>maxDay)day=1;

    return {
      zodiac:zodiacForYear(year),
      year:year,
      month:month,
      day:day
    };
  }catch(e){
    return fallback;
  }
}

function saveManualProfile(){
  var year=Number($("birthYearSelect").value);
  var profile={
    zodiac:zodiacForYear(year),
    year:year,
    month:Number($("birthMonthSelect").value),
    day:Number($("birthDaySelect").value)
  };
  try{
    localStorage.setItem(profileStorageKey(),JSON.stringify(profile));
  }catch(e){}
  return profile;
}

function zodiacForYear(year){
  /* 한국 연도 기준 띠:
     1973년 = 쥐띠, 1974년 = 소띠
     이후 12년 주기로 반복 */
  var baseYear = 1973; // 쥐띠
  var idx = ((Number(year) - baseYear) % 12 + 12) % 12;
  return zodiacOrder[idx];
}

function ageAtToday(year,month,day){
  var now=getKoreaNowParts();
  var age=now.year-year;
  if(now.month<month || (now.month===month && now.day<day))age--;
  return age;
}

function yearAge(year){
  var now=getKoreaNowParts();
  return now.year-Number(year);
}

function hashText(text){
  var h=2166136261;
  for(var i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}

function pick(arr,seed,salt){
  return arr[hashText(seed+"|"+salt)%arr.length];
}

function renderFortune(syncRemote){
  refreshBirthDays();

  var profile=saveManualProfile();
  var zodiac=profile.zodiac;

  $("zodiacEmoji").textContent=zodiacEmoji[zodiac]||"🔮";
  $("zodiacNameText").textContent=zodiac+"띠";
  var fullAge=ageAtToday(profile.year,profile.month,profile.day);
  var simpleYearAge=yearAge(profile.year);

  $("fullAgeText").textContent="만 "+fullAge+"세";
  $("yearAgeText").textContent="연나이 "+simpleYearAge+"세";
  var seed=koreaDateKey()+"|"+String(session&&session.code||"guest")+"|"+
    profile.year+"|"+profile.month+"|"+profile.day+"|"+zodiac;

  var score=70+(hashText(seed+"|score")%30);

  $("fortuneScore").textContent=score+"점";
  $("fortuneSummary").textContent=pick(summaries,seed,"summary");

  $("healthText").textContent=pick(health,seed,"health");
  $("moneyText").textContent=pick(money,seed,"money");
  $("relationText").textContent=pick(relation,seed,"relation");
  $("hikingText").textContent=pick(hiking,seed,"hiking");
  $("colorText").textContent=pick(colors,seed,"color");
  $("numberText").textContent=String(1+(hashText(seed+"|number")%9));
  $("timeText").textContent=pick(times,seed,"time");
  $("messageText").textContent="✨ "+pick(messages,seed,"message");

  if(syncRemote!==false){
    saveRemoteProfile(profile);
  }
}

  window.location.href=new URL("index.html",window.location.href).href;
}

$("backBtn").addEventListener("click",goEventMain);
$("exitBtn").addEventListener("click",goEventMain);

$("birthYearSelect").value=String(savedProfile.year);
$("birthMonthSelect").value=String(savedProfile.month);
refreshBirthDays();

renderFortune(false);
requestRemoteProfile();

})();
</script>
