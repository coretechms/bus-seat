<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315b45">
<title>산행 상식 O/X</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#edf4ef;color:#25332a}
body{min-height:100vh;min-height:100dvh}button{font-family:inherit}
.app{min-height:100vh;min-height:100dvh;padding:max(8px,env(safe-area-inset-top)) 8px max(9px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#deede1,#f8fbf9 48%,#edf4ef)}
.shell{width:min(720px,100%);margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
h1{margin:0;font-size:22px;color:#244c36}.sub{font-size:11px;font-weight:800;color:#718078;margin-top:2px}
.back{height:36px;padding:0 12px;border:1px solid #c8d9cc;border-radius:11px;background:#fff;color:#315b45;font-weight:900}
.dbstatus{margin-bottom:7px;padding:7px 9px;border:1px solid #d4e2d7;border-radius:10px;background:#fff;text-align:center;font-size:11px;font-weight:900;color:#53685a}
.dbstatus.ready{background:#f1f9f3;color:#2f6742}.dbstatus.error{background:#fff3f2;color:#97483f}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:7px}
.sbox{background:#fff;border:1px solid #d6e3da;border-radius:12px;text-align:center;padding:7px 4px}
.sl{font-size:10px;color:#839087;font-weight:800}.sv{font-size:15px;color:#315b45;font-weight:900;margin-top:2px}
.card{background:#fff;border:1px solid #d6e3da;border-radius:19px;padding:14px;box-shadow:0 8px 24px rgba(35,80,50,.09)}
.cat{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef6f0;color:#3d6d4e;font-size:11px;font-weight:900}
.qno{float:right;font-size:11px;font-weight:900;color:#7e8c83}
.question{clear:both;min-height:116px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 4px;font-size:20px;line-height:1.5;font-weight:900;word-break:keep-all}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.choice{height:88px;border:2px solid #d4e2d8;border-radius:17px;background:#f9fcfa;font-size:34px;font-weight:900;cursor:pointer}
.choice.o{color:#27714a}.choice.x{color:#ba4841}.choice.correct{background:#dff3e4;border-color:#6aaa7a}.choice.wrong{background:#fde7e5;border-color:#d99892}
.result{display:none;margin-top:10px;padding:11px;border-radius:13px;background:#f7faf8;border:1px solid #dbe6de}
.result.show{display:block}.rt{font-size:17px;font-weight:900;color:#315b45}.re{margin-top:6px;font-size:14px;line-height:1.55;font-weight:700;color:#596a60}
.next{display:none;width:100%;height:46px;margin-top:9px;border:0;border-radius:13px;background:#315b45;color:#fff;font-size:16px;font-weight:900}.next.show{display:block}
.foot{margin-top:7px;text-align:center;font-size:10px;color:#87928b;line-height:1.4}
@media(max-width:520px){h1{font-size:19px}.card{padding:10px}.question{min-height:105px;font-size:18px}.choice{height:74px;font-size:30px}.re{font-size:13px}.dbstatus{font-size:10px}}
</style>
</head>
<body>
<main class="app"><div class="shell">
<header class="top"><div><h1>⭕ 산행 상식 O/X</h1><div class="sub">실용 산행 안전·장비·예절 문제</div></div><button class="back" id="backBtn">이벤트</button></header>
<div class="dbstatus" id="dbStatus">O/X 문제 데이터를 불러오는 중입니다...</div>
<section class="score">
<div class="sbox"><div class="sl">문제</div><div class="sv" id="qCount">-</div></div>
<div class="sbox"><div class="sl">정답</div><div class="sv" id="correct">0</div></div>
<div class="sbox"><div class="sl">정답률</div><div class="sv" id="rate">0%</div></div>
</section>
<section class="card">
<span class="cat" id="category">산행 상식</span><span class="qno" id="bankInfo">문제은행 연결중</span>
<div class="question" id="question">문제 데이터를 준비하고 있습니다.</div>
<div class="choices"><button class="choice o" id="oBtn">O</button><button class="choice x" id="xBtn">X</button></div>
<div class="result" id="result"><div class="rt" id="rt"></div><div class="re" id="re"></div></div>
<button class="next" id="nextBtn">다음 문제</button>
</section>
<div class="foot">일반적인 산행 안전 상식입니다. 현장에서는 기상특보·관리기관 안내·119 지시를 우선하세요.</div>
</div></main>

<script>
(function(){
"use strict";
var DATA_URL="ox-data.html";
var SESSION_KEY="geomam-event-session";
var STATE_PREFIX="geomam-hiking-ox-v2:";
var CACHE_KEY="geomam-hiking-ox-data-cache-v1";
var session=null,bank=[],state=null;

function $(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function setStatus(t,c){var e=$("dbStatus");e.textContent=t;e.classList.remove("ready","error");if(c)e.classList.add(c)}
function normalize(items){
 return (Array.isArray(items)?items:[]).filter(function(x){return x&&x.q&&typeof x.answer==="boolean"}).map(function(x){
  return{id:Number(x.id||0),cat:String(x.cat||"산행 상식"),q:String(x.q),answer:!!x.answer,ex:String(x.ex||"")};
 });
}
function loadData(){
 return new Promise(function(resolve,reject){
  var done=false,frame=document.createElement("iframe");frame.hidden=true;frame.src=DATA_URL+"?v=1";document.body.appendChild(frame);
  function clean(){window.removeEventListener("message",msg);if(frame.parentNode)frame.remove()}
  function finish(items){if(done)return;var n=normalize(items);if(n.length<4)return;done=true;bank=n;try{localStorage.setItem(CACHE_KEY,JSON.stringify(n))}catch(e){}setStatus("O/X 문제은행 "+n.length+"문제 불러오기 완료","ready");clean();resolve()}
  function msg(ev){var d=ev.data||{};if(d.type==="OX_DATABASE_READY")finish(d.items)}
  window.addEventListener("message",msg);
  frame.onerror=function(){var c=[];try{c=normalize(JSON.parse(localStorage.getItem(CACHE_KEY)||"[]"))}catch(e){}if(c.length>=4){bank=c;done=true;setStatus("데이터 연결 실패 · 저장된 "+c.length+"문제 사용","error");clean();resolve()}else{clean();reject(new Error("ox-data.html 연결 실패"))}};
  setTimeout(function(){if(done)return;var c=[];try{c=normalize(JSON.parse(localStorage.getItem(CACHE_KEY)||"[]"))}catch(e){}if(c.length>=4){bank=c;done=true;setStatus("응답 지연 · 저장된 "+c.length+"문제 사용","error");clean();resolve()}else{clean();reject(new Error("O/X 문제 데이터 응답시간 초과"))}},5000);
 });
}
function loadSession(){try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null")}catch(e){return null}}
function key(){return STATE_PREFIX+String(session&&session.code||"guest")}
function fresh(){return{order:shuffle(bank.map(function(_,i){return i})),index:0,correct:0,answered:0,cycle:1,locked:false}}
function loadState(){try{var s=JSON.parse(localStorage.getItem(key())||"null");if(!s||!Array.isArray(s.order)||s.order.length!==bank.length)return fresh();s.locked=false;return s}catch(e){return fresh()}}
function save(){try{localStorage.setItem(key(),JSON.stringify(state))}catch(e){}}
function cur(){return bank[state.order[state.index]]}
function score(){
 $("qCount").textContent=(state.index+1)+" / "+bank.length;
 $("correct").textContent=state.correct;
 $("rate").textContent=state.answered?Math.round(state.correct/state.answered*100)+"%":"0%";
 $("bankInfo").textContent="문제은행 "+bank.length+"문제 · "+state.cycle+"회차";
}
function render(){
 state.locked=false;var q=cur();$("category").textContent=q.cat;$("question").textContent=q.q;
 $("result").classList.remove("show");$("nextBtn").classList.remove("show");
 $("oBtn").disabled=false;$("xBtn").disabled=false;$("oBtn").classList.remove("correct","wrong");$("xBtn").classList.remove("correct","wrong");score();
}
function answer(v,b){
 if(state.locked)return;state.locked=true;var q=cur(),ok=v===q.answer;state.answered++;if(ok)state.correct++;
 var good=q.answer?$("oBtn"):$("xBtn");good.classList.add("correct");if(!ok)b.classList.add("wrong");
 $("oBtn").disabled=true;$("xBtn").disabled=true;
 $("rt").textContent=ok?"✅ 정답입니다!":"❌ 아쉽습니다. 정답은 "+(q.answer?"O":"X")+"입니다.";
 $("re").textContent=q.ex;$("result").classList.add("show");$("nextBtn").classList.add("show");score();save();
}
function next(){state.index++;if(state.index>=bank.length){state.index=0;state.cycle++;state.order=shuffle(bank.map(function(_,i){return i}))}save();render()}
function home(){location.href=new URL("index.html",location.href).href}

$("oBtn").onclick=function(){answer(true,this)};
$("xBtn").onclick=function(){answer(false,this)};
$("nextBtn").onclick=next;$("backBtn").onclick=home;
session=loadSession();
loadData().then(function(){state=loadState();render()}).catch(function(e){setStatus(e.message||"문제 데이터 연결 실패","error");$("question").textContent="ox-data.html 파일 위치를 확인하세요.";$("oBtn").disabled=true;$("xBtn").disabled=true});
try{if(parent&&parent!==window)parent.postMessage({type:"BUS_SEAT_EVENT_READY",event:"ox"},"*")}catch(e){}
window.addEventListener("message",function(ev){var d=ev.data||{};if(d.type==="BUS_SEAT_EVENT_SESSION"&&d.session){var old=key();session=d.session;if(bank.length&&old!==key()){state=loadState();render()}}});
})();
</script>
</body>
</html>
